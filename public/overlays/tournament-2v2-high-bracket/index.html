<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --gold-bright: #ffed4a; --red: #8b0000; --blue: #0044ff; }
        * { font-family: 'Outfit', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 1920px; height: 1080px; color: white; overflow: hidden;
            background: transparent;
        }

        #header { 
            position: absolute; top: 0; width: 100%; height: 120px; 
            display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0.8)); 
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 10px 50px rgba(0,0,0,0.9);
            z-index: 100;
        }
        #bracket-title { font-size: 48px; font-weight: 950; text-transform: uppercase; letter-spacing: 10px; color: #fff; text-shadow: 0 0 30px rgba(212, 175, 55, 0.5); }

        #bracket-container {
            position: absolute; top: 180px; left: 50%; transform: translateX(-50%);
            width: 1720px; height: 800px;
            display: flex; justify-content: space-between; align-items: stretch;
            padding: 60px 40px;
            background: rgba(10, 15, 28, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
        }

        .phase-column {
            display: flex; flex-direction: column; justify-content: space-around;
            flex: 1; gap: 20px; padding: 0 10px;
        }

        .phase-label { 
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%); 
            background: var(--gold); color: #000; padding: 10px 40px; border-radius: 15px; 
            font-size: 16px; font-weight: 900; text-transform: uppercase; letter-spacing: 6px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); white-space: nowrap; 
        }

        .match-card { 
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.9); 
            transition: all 0.5s ease;
        }
        
        .team-row { 
            display: flex; align-items: center; padding: 15px 25px; height: 100px; 
            position: relative; border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
        }
        .team-row:last-child { border-bottom: none; }
        .team-row.winner { background: rgba(212, 175, 55, 0.15); }
        .team-row.winner::after { content: '🏆'; position: absolute; right: 20px; font-size: 32px; filter: drop-shadow(0 0 10px var(--gold)); }
        
        .bye-badge { background: var(--gold); color: black; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 4px; margin-left: 10px; vertical-align: middle; }
        
        .team-info { flex: 1; display: flex; flex-direction: column; }
        .team-name { font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; line-height: 1.1; }
        .team-players { font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 2px; }

        .team-civs { display: flex; gap: 5px; margin-top: 8px; }
        .civ-flag { width: 30px; height: 18px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1); background-size: cover; background-position: center; }

        .vs-divider { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 900; color: rgba(255,255,255,0.1); letter-spacing: 5px; z-index: 5; }

    </style>
</head>
<body>
    <div id="header">
        <div id="bracket-title">TABELLONE TORNEO 2V2</div>
    </div>
    
    <div id="bracket-container"></div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        
        let OVERLAY_ID = window.location.pathname.split('/').filter(p => p && p !== 'index.html').pop();
        if (!OVERLAY_ID || OVERLAY_ID === 'overlays') {
            const params = new URLSearchParams(window.location.search);
            OVERLAY_ID = params.get('id') || "tournament-2v2-high-bracket";
        }

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        function getCivFlagUrl(id) {
            if (!id) return '';
            const mapping = {
                'abbasid': 'Abbasid Dynasty', 'ayyubids': 'Ayyubids', 'byzantines': 'Byzantines',
                'chinese': 'Chinese', 'delhi': 'Delhi Sultanate', 'english': 'English',
                'french': 'French', 'hre': 'Holy Roman Empire', 'japanese': 'Japanese',
                'jeannedarc': 'Jeanne dArc', 'malians': 'Malians', 'mongols': 'Mongols',
                'orderofthedragon': 'Order of the Dragon', 'ottomans': 'Ottomans',
                'rus': 'Rus', 'zhuxi': 'Zhu Xis Legacy'
            };
            const name = mapping[id.toLowerCase()] || id;
            return `/civs/${name}.png`;
        }

        function render(state) {
            if (!state || !state.bracket) return;
            const b = state.bracket;
            document.getElementById('bracket-title').innerText = b.title || 'TABELLONE TORNEO 2V2';
            const container = document.getElementById('bracket-container');
            container.innerHTML = '';
            (b.phases || []).forEach((phase, pIdx) => {
                const column = document.createElement('div');
                column.className = 'phase-column';
                column.style.position = 'relative';
                const label = document.createElement('div');
                label.className = 'phase-label';
                label.innerText = phase.name;
                column.appendChild(label);
                (phase.matches || []).forEach((match, mIdx) => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    const renderTeam = (teamName, players, civs, isWinner, hasBye) => `
                        <div class="team-row ${isWinner ? 'winner' : ''}">
                            <div class="team-info">
                                <div class="team-name">
                                    ${teamName || '--'}
                                    ${hasBye ? '<span class="bye-badge">BYE</span>' : ''}
                                </div>
                                <div class="team-players">${(players || []).join(' & ') || '-- & --'}</div>
                                <div class="team-civs">
                                    ${(civs || []).map(c => `<div class="civ-flag" style="background-image: url('${getCivFlagUrl(c)}')"></div>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                    card.innerHTML = `
                        ${renderTeam(match.t1, match.t1Players, match.t1Civs, match.w === 1, match.t1Bye)}
                        ${renderTeam(match.t2, match.t2Players, match.t2Civs, match.w === 2, match.t2Bye)}
                    `;
                    column.appendChild(card);
                });
                container.appendChild(column);
            });
        }

        async function init() {
            const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
            if (data?.state) render(data.state);
            client.channel('public:stream_overlays').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: `id=eq.${OVERLAY_ID}` }, payload => render(payload.new.state)).subscribe();
        }
        init();
    </script>
</body>
</html>
