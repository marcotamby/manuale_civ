<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-bright: #ffed4a; 
            --red: #8b0000; 
            --blue: #0044ff;
            --bg-dark: rgba(10, 15, 28, 0.9);
            --accent: #00f2ff;
        }
        * { font-family: 'Outfit', 'Inter', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 1920px; height: 1080px; color: white; overflow: hidden;
            background: url('../tournament-bg.png') center/cover no-repeat transparent;
        }

        #header { 
            position: absolute; top: 0; width: 100%; height: 160px; 
            display: flex; justify-content: center; align-items: stretch; 
            background: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 100%); 
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 50px rgba(0,0,0,0.9);
            z-index: 100;
        }

        .team-section { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 60px; position: relative; }
        .team-left { align-items: flex-start; text-align: left; }
        .team-right { align-items: flex-end; text-align: right; }

        .team-name { font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: #fff; line-height: 1; }
        .player-names { font-size: 18px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 4px; margin-top: 4px; opacity: 0.8; }

        .score-center { width: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .score-row { display: flex; align-items: center; gap: 30px; }
        .score-box { font-size: 72px; font-weight: 950; background: var(--red); width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--gold); border-radius: 16px; box-shadow: 0 0 40px rgba(139, 0, 0, 0.5); }
        .vs-box { font-size: 24px; font-weight: 900; color: #555; letter-spacing: 8px; }
        .bo-label { margin-top: 10px; font-size: 12px; font-weight: 900; color: #aaa; text-transform: uppercase; letter-spacing: 6px; }

        .draft-civs { display: flex; gap: 8px; margin-top: 15px; }
        .draft-flag { width: 40px; height: 24px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); filter: grayscale(1) opacity(0.5); background-size: cover; background-position: center; image-rendering: -webkit-optimize-contrast; }
        .draft-flag.active { filter: none; opacity: 1; border-color: var(--gold); }

        .bans-container { position: absolute; bottom: 15px; display: flex; gap: 10px; }
        .team-left .bans-container { left: 60px; }
        .team-right .bans-container { right: 60px; }
        .ban-flag { width: 32px; height: 20px; border-radius: 3px; border: 1px solid rgba(255,0,0,0.5); filter: grayscale(0.5) sepia(0.5) hue-rotate(-50deg); background-size: cover; image-rendering: -webkit-optimize-contrast; }
        .ban-label { font-size: 9px; font-weight: 900; color: #ff4444; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2px; }

        /* Maps Section */
        #maps-section {
            position: absolute; top: 220px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 40px; justify-content: center; width: 100%; max-width: 1500px;
            padding: 0 50px; flex-wrap: wrap;
        }
        
        .map-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .map-wrapper.next {
            z-index: 10;
        }
        
        .map-card {
            width: 440px; height: 220px; background: var(--bg-dark); border-radius: 20px; 
            border: 2px solid rgba(255,255,255,0.05); overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }
        
        @keyframes boxPulse {
            0% { 
                box-shadow: 0 0 30px rgba(0, 68, 255, 0.3); 
                transform: scale(1.02);
                border-color: rgba(0, 68, 255, 0.4);
            }
            50% { 
                box-shadow: 0 0 60px rgba(0, 68, 255, 0.7), 0 0 100px rgba(0, 68, 255, 0.3); 
                transform: scale(1.06);
                border-color: rgba(0, 68, 255, 1);
            }
            100% { 
                box-shadow: 0 0 30px rgba(0, 68, 255, 0.3); 
                transform: scale(1.02);
                border-color: rgba(0, 68, 255, 0.4);
            }
        }
        .map-wrapper.next .map-card { animation: boxPulse 2.5s infinite ease-in-out; }
        .map-wrapper.next .map-card::before {
            content: 'PROSSIMO GAME';
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: var(--blue); color: white; padding: 4px 15px; border-radius: 20px;
            font-size: 10px; font-weight: 900; letter-spacing: 2px; z-index: 10;
            animation: pulse 2s infinite;
        }
        .map-wrapper.next .map-image { filter: brightness(1.2); }
        .map-wrapper.next .map-overlay { background: linear-gradient(to top, rgba(0,0,0,0.6), rgba(0,0,0,0.1)); }

        .map-image { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 1; }
        .map-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2)); z-index: 2; }
        
        .map-name-label { 
            padding: 6px 20px; border-radius: 8px; background: rgba(0,0,0,0.8);
            font-size: 20px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 2px 10px rgba(0,0,0,1); z-index: 3; color: white;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 0px;
        }

        .winner-icon {
            position: absolute; top: -30px;
            z-index: 100; display: none; filter: drop-shadow(0 0 15px rgba(255,215,0,0.6));
            font-size: 32px;
        }
        .winner-icon.win-t1 { left: 60px; transform: translateX(-50%); }
        .winner-icon.win-t2 { right: 60px; transform: translateX(50%); }

        /* Left/Right Civ Layout */
        .civs-left, .civs-right {
            position: absolute; top: 0; bottom: 0; width: 120px;
            display: flex; flex-direction: column; z-index: 3;
        }
        .civs-left { left: 0; }
        .civs-right { right: 0; }

        .map-civ-flag {
            flex: 1; background-size: cover; background-position: center;
            position: relative;
        }
        .civs-left .map-civ-flag {
            -webkit-mask-image: linear-gradient(to right, black 20%, transparent 100%);
            mask-image: linear-gradient(to right, black 20%, transparent 100%);
        }
        .civs-right .map-civ-flag {
            -webkit-mask-image: linear-gradient(to left, black 20%, transparent 100%);
            mask-image: linear-gradient(to left, black 20%, transparent 100%);
        }
        
        .map-civ-flag.sniped { filter: brightness(0.6); }
        .map-civ-flag.sniped::after {
            content: '✕'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #ff0000; font-size: 60px; font-weight: 900; text-shadow: 0 0 20px rgba(0,0,0,1);
            z-index: 10;
        }

        .map-wrapper.loser-t1 .civs-left .map-civ-flag { filter: brightness(0.4) grayscale(0.5); }
        .map-wrapper.loser-t2 .civs-right .map-civ-flag { filter: brightness(0.4) grayscale(0.5); }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 68, 255, 0.7); transform: translateX(-50%) scale(1); }
            70% { box-shadow: 0 0 0 15px rgba(0, 68, 255, 0); transform: translateX(-50%) scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(0, 68, 255, 0); transform: translateX(-50%) scale(1); }
        }

        #timer-container { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); display: none; flex-direction: column; align-items: center; gap: 8px; }
        #timer-label { color: var(--accent); font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 6px; text-shadow: 0 0 20px rgba(0, 242, 255, 0.6); }
        #timer-display { color: #fff; font-size: 42px; font-weight: 950; background: linear-gradient(180deg, #0a192f 0%, #000c1d 100%); padding: 8px 40px; border-radius: 20px; border: 3px solid var(--accent); box-shadow: 0 0 30px rgba(0, 242, 255, 0.3); letter-spacing: 2px; }

        /* Casters Section */
        #casters-container {
            position: absolute; bottom: 40px; width: 100%; padding: 0 80px;
            display: flex; justify-content: space-between; align-items: flex-end;
            pointer-events: none; z-index: 50;
        }
        .caster-box {
            width: 340px; height: 220px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.4); border-radius: 12px;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; justify-content: flex-end;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 10px rgba(0, 242, 255, 0.1);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .caster-webcam { position: absolute; inset: 0; background: transparent; z-index: 1; }
        .caster-name-label {
            position: relative; z-index: 2; 
            padding: 10px 20px; font-size: 18px; font-weight: 950; text-transform: uppercase; letter-spacing: 4px;
            text-align: center;
            
            /* Silver White Gradient Text */
            background: linear-gradient(to bottom, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
        }
        .caster-name-label::before {
            content: ''; position: absolute; inset: 0;
            /* Cyan Background Bar (Timer Accent) */
            background: linear-gradient(to right, transparent, rgba(0, 242, 255, 0.4), transparent);
            z-index: -1;
            border-top: 2px solid rgba(0, 242, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .draft-flag.banned { 
            filter: brightness(0.6); 
            position: relative;
        }
        .draft-flag.banned::after {
            content: '✕'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #ff0000; font-size: 24px; font-weight: 900; text-shadow: 0 0 10px rgba(0,0,0,1);
        }
    </style>
</head>
<body>
    <div id="header">
        <div class="team-section team-left">
            <div id="t1-name" class="team-name">--</div>
            <div id="t1-players" class="player-names">-- & --</div>
            <div id="t1-draft" class="draft-civs"></div>
        </div>

        <div class="score-center">
            <div class="score-row">
                <div id="t1-score" class="score-box">0</div>
                <div class="vs-box">VS</div>
                <div id="t2-score" class="score-box">0</div>
            </div>
            <div class="bo-label">Best of 3</div>
        </div>

        <div class="team-section team-right">
            <div id="t2-name" class="team-name">--</div>
            <div id="t2-players" class="player-names">-- & --</div>
            <div id="t2-draft" class="draft-civs"></div>
        </div>
    </div>

    <div id="maps-section"></div>

    <div id="casters-container">
        <div id="caster-1" class="caster-box" style="display: none;">
            <div class="caster-webcam"></div>
            <div class="caster-name-label">CASTER 1</div>
        </div>
        <div id="caster-2" class="caster-box" style="display: none;">
            <div class="caster-webcam"></div>
            <div class="caster-name-label">CASTER 2</div>
        </div>
    </div>

    <div id="timer-container">
        <div id="timer-label">Il game inizia tra...</div>
        <div id="timer-display">00:00</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        
        let OVERLAY_ID = window.location.pathname.split('/').filter(p => p && p !== 'index.html').pop();
        if (!OVERLAY_ID || OVERLAY_ID === 'overlays') {
            const params = new URLSearchParams(window.location.search);
            OVERLAY_ID = params.get('id') || "tournament-2v2-high-match";
        }
        
        const IS_HIGH_ELO = OVERLAY_ID.includes('high');

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let lastState = null;

        function getCivFlagUrl(id) {
            if (!id) return '';
            if (id.startsWith('/') || id.includes('.png') || id.includes('.webp')) return id;
            const mapping = {
                'abbasid': 'Abbasid Dynasty', 'ayyubids': 'Ayyubids', 'byzantines': 'Byzantines',
                'chinese': 'Chinese', 'delhi': 'Delhi Sultanate', 'english': 'English',
                'french': 'French', 'hre': 'Holy Roman Empire', 'japanese': 'Japanese',
                'jeannedarc': 'jeannedarc', 'malians': 'Malians', 'mongols': 'Mongols',
                'orderofthedragon': 'Order of the Dragon', 'ottomans': 'Ottomans',
                'rus': 'Rus', 'zhuxi': 'Zhu Xis Legacy',
                'goldenhorde': 'Golden Horde', 'lancaster': 'House of Lancaster',
                'templar': 'Knights Templar', 'macedonian': 'Macedonian Dynasty',
                'sengoku': 'Sengoku Daimyo', 'tughlaq': 'Tughlaq Dynasty',
                'jin-dynasty': '/civs/Jin Dynasty.png'
            };
            const mapped = mapping[id.toLowerCase()];
            if (mapped) {
                return mapped.startsWith('/') ? mapped : `/civs/${mapped}.png`;
            }
            return `/civs/${id}.png`;
        }

        function getMapUrl(name) { return `/maps/${name}.png`; }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return [m, s].map(v => v.toString().padStart(2, '0')).join(':');
        }

        function updateTimer() {
            const container = document.getElementById('timer-container');
            const display = document.getElementById('timer-display');
            if (!lastState || !lastState.timer || !lastState.timer.active) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            const elapsed = Math.floor((Date.now() - (lastState.timer.timestamp || Date.now())) / 1000);
            const total = ((lastState.timer.min || 0) * 60) + (lastState.timer.sec || 0);
            let remaining = Math.max(0, total - elapsed);
            display.innerText = remaining <= 0 ? "IL GAME STA PER INIZIARE!" : formatTime(remaining);
        }

        function render(state) {
            if (!state) return;
            lastState = state;

            document.getElementById('t1-name').innerText = state.t1?.name || 'TEAM ALPHA';
            document.getElementById('t1-players').innerText = (state.t1?.players || []).join(' & ') || '-- & --';
            document.getElementById('t1-score').innerText = state.t1?.score ?? 0;
            
            document.getElementById('t2-name').innerText = state.t2?.name || 'TEAM BETA';
            document.getElementById('t2-players').innerText = (state.t2?.players || []).join(' & ') || '-- & --';
            document.getElementById('t2-score').innerText = state.t2?.score ?? 0;

            const renderDraft = (containerId, civs, bans) => {
                const container = document.getElementById(containerId);
                container.innerHTML = '';
                (civs || []).forEach(civId => {
                    const div = document.createElement('div');
                    div.className = 'draft-flag active';
                    div.style.backgroundImage = `url('${getCivFlagUrl(civId)}')`;
                    container.appendChild(div);
                });
                if (IS_HIGH_ELO && bans) {
                    bans.forEach(civId => {
                        const div = document.createElement('div');
                        div.className = 'draft-flag active banned';
                        div.style.backgroundImage = `url('${getCivFlagUrl(civId)}')`;
                        container.appendChild(div);
                    });
                }
                const expectedTotal = IS_HIGH_ELO ? 9 : 11;
                const currentTotal = (civs?.length || 0) + (IS_HIGH_ELO ? (bans?.length || 0) : 0);
                for(let i = currentTotal; i < expectedTotal; i++) {
                    const div = document.createElement('div');
                    div.className = 'draft-flag';
                    container.appendChild(div);
                }
            };
            renderDraft('t1-draft', state.t1?.draftCivs, state.t1?.bans);
            renderDraft('t2-draft', state.t2?.draftCivs, state.t2?.bans);
            
            // Render Casters
            (state.casters || []).forEach((c, i) => {
                const el = document.getElementById(`caster-${i+1}`);
                if (el) {
                    el.style.display = c.active ? 'flex' : 'none';
                    el.querySelector('.caster-name-label').innerText = c.name || `CASTER ${i+1}`;
                }
            });

            const bestOfElem = document.getElementById('best-of-text');
            if (bestOfElem) bestOfElem.innerText = `BEST OF ${state.maps?.length || 3}`;
            
            const mapsContainer = document.getElementById('maps-section');
            mapsContainer.innerHTML = '';
            (state.maps || []).forEach((map, idx) => {
                const isT1Winner = map.winner === 1;
                const isT2Winner = map.winner === 2;
                const loserT1Class = isT2Winner ? 'loser-t1' : '';
                const loserT2Class = isT1Winner ? 'loser-t2' : '';
                
                const wrapper = document.createElement('div');
                wrapper.className = `map-wrapper ${map.isNext ? 'next' : ''} ${loserT1Class} ${loserT2Class}`;
                
                let t1FlagsHTML = '';
                (map.t1Civs || []).forEach(civId => {
                    if (civId) t1FlagsHTML += `<div class="map-civ-flag ${map.t1Snipe === civId ? 'sniped' : ''}" style="background-image: url('${getCivFlagUrl(civId)}')"></div>`;
                });
                if (map.t1Snipe && !(map.t1Civs || []).includes(map.t1Snipe)) {
                    t1FlagsHTML += `<div class="map-civ-flag sniped" style="background-image: url('${getCivFlagUrl(map.t1Snipe)}')"></div>`;
                }

                let t2FlagsHTML = '';
                (map.t2Civs || []).forEach(civId => {
                    if (civId) t2FlagsHTML += `<div class="map-civ-flag ${map.t2Snipe === civId ? 'sniped' : ''}" style="background-image: url('${getCivFlagUrl(civId)}')"></div>`;
                });
                if (map.t2Snipe && !(map.t2Civs || []).includes(map.t2Snipe)) {
                    t2FlagsHTML += `<div class="map-civ-flag sniped" style="background-image: url('${getCivFlagUrl(map.t2Snipe)}')"></div>`;
                }

                const mapNameStr = map.name ? map.name : 'TBD';
                wrapper.innerHTML = `
                    <div class="winner-icon ${isT1Winner ? 'win-t1' : 'win-t2'}" style="display: ${map.winner ? 'block' : 'none'};">🏆</div>
                    <div class="map-card">
                        <div class="map-image" style="background-image: url('${getMapUrl(map.name)}')"></div>
                        <div class="map-overlay"></div>
                        
                        <div class="civs-left">
                            ${t1FlagsHTML}
                        </div>
                        <div class="civs-right">
                            ${t2FlagsHTML}
                        </div>
                    </div>
                    <div class="map-name-label">${mapNameStr}</div>
                `;
                mapsContainer.appendChild(wrapper);
            });

            updateTimer();
        }

        async function init() {
            const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
            if (data?.state) render(data.state);
            client.channel('public:stream_overlays').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: `id=eq.${OVERLAY_ID}` }, payload => render(payload.new.state)).subscribe();
            setInterval(updateTimer, 1000);
        }
        init();
    </script>
</body>
</html>
