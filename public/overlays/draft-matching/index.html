<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Disable Browser Caching completely for overlays -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Draft Matching Overlay</title>
    <!-- Import Dynamic Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;700&family=Montserrat:wght@400;700;900&family=Cinzel:wght@700;900&family=Orbitron:wght@700;900&family=Bebas+Neue&family=Russo+One&family=Teko:wght@700&family=Press+Start+2P&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #d4af37;
            --gold-bright: #ffed4a;
            --blue: #00f0ff; /* Lighter, more luminous neon cyan-blue */
            --bg-dark: #05080f;
            --card-bg: rgba(10, 15, 26, 0.85);
            --border-glow-gold: rgba(212, 175, 55, 0.4);
            --border-glow-blue: rgba(0, 240, 255, 0.4);
            --silver-blue-bright: #d0e1f9;
            --silver-blue-medium: #a3c2e0;
            --silver-blue-dark: #668cb3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 1920px;
            height: 1080px;
            color: white;
            overflow: hidden;
            background-color: var(--bg-dark);
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        /* Full Screen SVG for line drawing */
        #connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            pointer-events: none;
            z-index: 5;
        }

        /* Glowing Connection Lines with Slow Draw Animation */
        @keyframes draw-line {
            from {
                stroke-dashoffset: var(--path-length, 1200);
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        .connection-line {
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: var(--path-length, 1200);
            stroke-dashoffset: var(--path-length, 1200);
            animation: draw-line 5s cubic-bezier(0.2, 0.6, 0.2, 1) forwards;
        }

        .glow-thick {
            stroke: var(--gold);
            stroke-width: 30px;
            opacity: 0.12;
            filter: blur(10px);
        }

        .glow-medium {
            stroke: var(--gold);
            stroke-width: 12px;
            opacity: 0.35;
            filter: blur(4px);
        }

        .core-line {
            stroke: #ffffff;
            stroke-width: 4px;
            opacity: 0.95;
            filter: drop-shadow(0 0 6px var(--gold-bright));
        }

        /* Overlay Layout Header */
        #header-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        #header-title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            paint-order: stroke fill;
        }

        /* Columns Containers - Centered vertically, wraps content height */
        .side-container {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            width: 360px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: auto;
            max-height: 600px;
        }

        #coaches-container {
            left: 120px;
        }

        #students-container {
            right: 120px;
        }

        /* Distinct and themed solid background for column titles (not blurred, narrower - 200px) */
        .column-title {
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            padding: 10px 16px;
            border-radius: 12px;
            width: 200px;
            margin-left: auto;
            margin-right: auto;
            transition: all 0.3s ease;
        }

        #coaches-container .column-title {
            background: #1a140a; /* solid dark amber */
            border: 1.5px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        #students-container .column-title {
            background: #06121a; /* solid dark cyan-blue */
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .gold-text {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
        }

        .blue-text {
            color: var(--blue);
            text-shadow: 0 0 12px rgba(0, 217, 255, 0.25);
        }

        /* SMART NAMES LIST CONFIGURATION */
        .names-list {
            display: flex;
            flex-direction: column;
            gap: var(--card-gap, 16px);
            transition: all 0.3s ease;
        }

        /* Esports Card Styles */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--card-border-radius, 16px);
            padding: var(--card-padding, 20px 24px);
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            height: var(--card-height, 64px);
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .coach-card {
            /* Neutral by default */
        }

        .coach-card.paired {
            border-left: 6px solid var(--gold);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.12), 0 0 15px rgba(212, 175, 55, 0.05);
        }

        .student-card {
            justify-content: flex-end;
        }

        .student-card.paired {
            border-right: 6px solid var(--blue);
            box-shadow: 0 12px 32px rgba(0, 240, 255, 0.12), 0 0 15px rgba(0, 240, 255, 0.05);
        }

        .card-name {
            font-size: var(--card-font-size, 18px);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.3s ease;
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .coach-civ-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: flex-end;
            max-width: 220px;
        }

        .coach-civ-icon {
            width: 42px;
            height: 28px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 0 12px rgba(255,255,255,0.08);
        }

        /* SINGLE CASTER AREA - Positioned Centrally at the Bottom */
        #casters-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            height: 340px;
            pointer-events: none;
            z-index: 10;
        }

        .caster-box {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translate(-50%, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            visibility: hidden;
        }

        .caster-box.active {
            opacity: 1;
            transform: translate(-50%, 0);
            visibility: visible;
        }

        /* Webcam frame - Highly luminous Silver-Blue Glow */
        .webcam-frame {
            width: 420px;
            height: 236px;
            border: 2.5px solid var(--silver-blue-bright);
            background: rgba(10, 15, 28, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 0px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), 
                        0 0 25px rgba(208, 225, 249, 0.35), 
                        inset 0 0 24px rgba(208, 225, 249, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* Scanline scan effects in Silver-Blue */
        .webcam-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(208, 225, 249, 0.05) 50%, rgba(0, 0, 0, 0.08) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Caster Nameplate - Highly luminous and shiny metallic gradient */
        .caster-name {
            background: linear-gradient(135deg, #ffffff 0%, var(--silver-blue-bright) 50%, var(--silver-blue-medium) 100%);
            color: var(--bg-dark);
            font-weight: 900;
            padding: 8px 36px;
            font-size: 17px;
            border-radius: 30px;
            text-transform: uppercase;
            min-width: 240px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(208, 225, 249, 0.55), 0 0 15px rgba(255, 255, 255, 0.25);
            border: 1.5px solid #ffffff;
            letter-spacing: 1.5px;
            text-shadow: 0 1px 0px rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body>
    <div id="header-container">
        <h1 id="header-title">MATCHMAKING DRAFT</h1>
    </div>

    <!-- Connection SVG layer -->
    <svg id="connections-svg"></svg>

    <!-- Coaches Column (Left) -->
    <div id="coaches-container" class="side-container">
        <h2 class="column-title gold-text">COACH</h2>
        <div id="coaches-list" class="names-list"></div>
    </div>

    <!-- Students Column (Right) -->
    <div id="students-container" class="side-container">
        <h2 class="column-title blue-text">ALLIEVI</h2>
        <div id="students-list" class="names-list"></div>
    </div>

    <!-- Casters Area (Single Caster Box) -->
    <div id="casters-container">
        <div id="cb-1" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-1-name" class="caster-name"></div>
        </div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        
        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let lastState = null;
        let currentBackgroundUrl = null;
        const sessionBuster = Date.now();

        // Tracks which pairings have had their line fully drawn (student border can show)
        // key = "coachId-studentId", value = true
        const arrivedPairings = new Map();
        // Tracks pending setTimeout IDs for pairings currently animating
        const pendingBorderTimers = new Map();

        const PAIRING_COLORS = [
            '#00f0ff', // Electric Cyan
            '#ff007b', // Hot Pink
            '#00ff88', // Emerald Green
            '#bd00ff', // Violet/Purple
            '#ff7b00', // Neon Orange
            '#ffd800', // Bright Gold
            '#ff3c3c', // Vivid Coral/Red
            '#0088ff', // Sky Blue
            '#a2ff00', // Lime Green
            '#ff00d4'  // Magenta
        ];

        const CIV_DATA = {
            'abbasid': { flag: 'Abbasid Dynasty.webp' },
            'ayyubids': { flag: 'Ayyubids.webp' },
            'byzantines': { flag: 'Byzantines.webp' },
            'chinese': { flag: 'Chinese.webp' },
            'delhi': { flag: 'Delhi Sultanate.webp' },
            'english': { flag: 'English.webp' },
            'french': { flag: 'French.webp' },
            'goldenhorde': { flag: 'Golden Horde.webp' },
            'hre': { flag: 'Holy Roman Empire.webp' },
            'japanese': { flag: 'Japanese.webp' },
            'jeannedarc': { flag: 'jeannedarc.webp' },
            'lancaster': { flag: 'House of Lancaster.webp' },
            'malians': { flag: 'Malians.webp' },
            'mongols': { flag: 'Mongols.webp' },
            'orderofthedragon': { flag: 'Order of the Dragon.webp' },
            'ottomans': { flag: 'Ottomans.webp' },
            'rus': { flag: 'Rus.webp' },
            'templar': { flag: 'Knights Templar.webp' },
            'zhuxi': { flag: 'Zhu Xis Legacy.webp' },
            'tughlaq': { flag: 'Tughlaq Dynasty.webp' },
            'sengoku': { flag: 'Sengoku Daimyo.webp' },
            'macedonian': { flag: 'Macedonian Dynasty.webp' },
            'jin-dynasty': { flag: '/civs/Jin Dynasty.png' }
        };

        function getCivFlagUrl(id) {
            if (!id) return '';
            if (id.startsWith('/civs/') || id.startsWith('/') || id.endsWith('.webp') || id.endsWith('.png')) {
                return id.startsWith('/') ? id : `/${id}`;
            }
            const data = CIV_DATA[id.toLowerCase()];
            if (data) {
                return data.flag.startsWith('/') ? data.flag : `/civs/${data.flag}`;
            }
            return `/civs/${id}.webp`;
        }

        function updateConnectingLines() {
            const svg = document.getElementById('connections-svg');
            
            if (!lastState || !lastState.pairings || lastState.pairings.length === 0) {
                svg.innerHTML = '';
                return;
            }

            const activeIds = new Set();
            
            lastState.pairings.forEach((pairing, index) => {
                const coachEl = document.getElementById(`coach-${pairing.coachId}`);
                const studentEl = document.getElementById(`student-${pairing.studentId}`);
                
                if (!coachEl || !studentEl) return;
                
                const coachRect = coachEl.getBoundingClientRect();
                const studentRect = studentEl.getBoundingClientRect();
                
                // Get absolute coordinates
                const x1 = coachRect.right;
                const y1 = coachRect.top + coachRect.height / 2;
                
                const x2 = studentRect.left;
                const y2 = studentRect.top + studentRect.height / 2;
                
                const dx = x2 - x1;
                const dy = y2 - y1;
                
                // Decoy student logic for visual suspense (heads towards wrong student first, then hooks to correct one)
                const allStudentCards = Array.from(document.querySelectorAll('.student-card'));
                const correctIndex = allStudentCards.findIndex(el => el.id === `student-${pairing.studentId}`);
                
                let decoyY = y2;
                if (allStudentCards.length > 1 && correctIndex !== -1) {
                    // Try to pick the adjacent student card (above or below)
                    const decoyIndex = correctIndex === 0 ? 1 : correctIndex - 1;
                    const decoyEl = allStudentCards[decoyIndex];
                    if (decoyEl) {
                        const decoyRect = decoyEl.getBoundingClientRect();
                        decoyY = decoyRect.top + decoyRect.height / 2;
                    }
                }

                // Winding "ghirigoro" path that sweeps towards decoyY before hooking to y2
                // Double S-curve with continuous horizontal tangents to guarantee perfect smoothness (no sharp turns)
                const x_join = x1 + dx * 0.68;
                
                const cp1_x1 = x1 + dx * 0.3;
                const cp1_y1 = y1;
                
                const cp2_x1 = x_join - dx * 0.15;
                const cp2_y1 = decoyY;
                
                const cp1_x2 = x_join + dx * 0.12;
                const cp1_y2 = decoyY;
                
                const cp2_x2 = x2 - dx * 0.12;
                const cp2_y2 = y2;
                
                const pathData = `M ${x1} ${y1} ` +
                                 `C ${cp1_x1} ${cp1_y1}, ${cp2_x1} ${cp2_y1}, ${x_join} ${decoyY} ` +
                                 `C ${cp1_x2} ${cp1_y2}, ${cp2_x2} ${cp2_y2}, ${x2} ${y2}`;
                
                const pairingId = `pair-${pairing.coachId}-${pairing.studentId}`;
                activeIds.add(pairingId);

                const pairingColor = PAIRING_COLORS[index % PAIRING_COLORS.length];

                // Find or create group element
                let group = document.getElementById(pairingId);
                if (!group) {
                    group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    group.setAttribute('id', pairingId);

                    const glowThick = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    glowThick.setAttribute('class', 'connection-line glow-thick');

                    const glowMedium = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    glowMedium.setAttribute('class', 'connection-line glow-medium');

                    const coreLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    coreLine.setAttribute('class', 'connection-line core-line');

                    group.appendChild(glowThick);
                    group.appendChild(glowMedium);
                    group.appendChild(coreLine);

                    svg.appendChild(group);
                }

                // Update paths d attribute
                const paths = group.querySelectorAll('path');
                paths.forEach(path => {
                    path.setAttribute('d', pathData);
                });

                // Apply dynamic pairing color
                const glowThick = group.querySelector('.glow-thick');
                const glowMedium = group.querySelector('.glow-medium');
                const coreLine = group.querySelector('.core-line');

                if (glowThick) glowThick.style.stroke = pairingColor;
                if (glowMedium) glowMedium.style.stroke = pairingColor;
                if (coreLine) coreLine.style.filter = `drop-shadow(0 0 6px ${pairingColor})`;

                // Measure path length and set as CSS variable to ensure instant drawing and true 5s duration
                try {
                    const samplePath = paths[0];
                    if (samplePath) {
                        const pathLength = Math.ceil(samplePath.getTotalLength() || 1200);
                        paths.forEach(path => {
                            path.style.setProperty('--path-length', pathLength);
                        });
                    }
                } catch (e) {
                    console.error("Error measuring path length:", e);
                }
            });

            // Remove groups that are no longer paired
            const existingGroups = svg.querySelectorAll('g');
            existingGroups.forEach(g => {
                const id = g.getAttribute('id');
                if (!activeIds.has(id)) {
                    svg.removeChild(g);
                }
            });
        }

        function render(state, backgroundUrl) {
            // Background image handling - Only update if changed to prevent flashing
            const targetBg = backgroundUrl || "../background/background.png";
            if (currentBackgroundUrl !== targetBg) {
                currentBackgroundUrl = targetBg;
                const bgWithBuster = `${targetBg}?v=${sessionBuster}`;
                document.body.style.backgroundImage = `url(${bgWithBuster})`;
            }

            if (!state) return;
            lastState = state;
            console.log("Rendering state:", state);

            // 1. Render Title Settings (Text, Font, Size, Colors, Border)
            const titleEl = document.getElementById('header-title');
            if (titleEl) {
                titleEl.innerText = state.titleText !== undefined ? state.titleText : "MATCHMAKING DRAFT";
                titleEl.style.fontFamily = state.titleFont ? `'${state.titleFont}', sans-serif` : "'Outfit', sans-serif";
                titleEl.style.fontSize = state.titleFontSize ? `${state.titleFontSize}px` : "32px";
                
                // Custom colors and border styling
                titleEl.style.color = state.titleColor || '#ffffff';
                titleEl.style.webkitTextStrokeColor = state.titleBorderColor || '#000000';
                titleEl.style.webkitTextStrokeWidth = state.titleBorderWidth !== undefined ? `${state.titleBorderWidth}px` : '0px';
                
                // Hide header title if text is completely empty
                if (state.titleText === '') {
                    titleEl.style.display = 'none';
                } else {
                    titleEl.style.display = 'block';
                }
            }

            // Smart Dynamic Scaling based on element count
            const N = Math.max((state.coaches || []).length, (state.students || []).length);
            const coachesList = document.getElementById('coaches-list');
            const studentsList = document.getElementById('students-list');

            let cardHeight = 64;
            let gap = 16;
            let fontSize = 18;
            let borderRadius = 16;
            let padding = "20px 24px";

            if (N >= 15) {
                cardHeight = 24;
                gap = 3;
                fontSize = 10;
                borderRadius = 6;
                padding = "4px 8px";
            } else if (N >= 12) {
                cardHeight = 32;
                gap = 5;
                fontSize = 11;
                borderRadius = 8;
                padding = "6px 12px";
            } else if (N >= 10) {
                cardHeight = 40;
                gap = 8;
                fontSize = 13;
                borderRadius = 10;
                padding = "8px 14px";
            } else if (N === 9) {
                cardHeight = 48;
                gap = 10;
                fontSize = 15;
                borderRadius = 12;
                padding = "12px 16px";
            } else if (N === 8) {
                cardHeight = 54;
                gap = 12;
                fontSize = 16;
                borderRadius = 14;
                padding = "14px 20px";
            }

            [coachesList, studentsList].forEach(listEl => {
                if (listEl) {
                    listEl.style.setProperty('--card-height', `${cardHeight}px`);
                    listEl.style.setProperty('--card-gap', `${gap}px`);
                    listEl.style.setProperty('--card-font-size', `${fontSize}px`);
                    listEl.style.setProperty('--card-border-radius', `${borderRadius}px`);
                    listEl.style.setProperty('--card-padding', padding);
                }
            });

            // 2. Render Coaches List (border appears immediately)
            coachesList.innerHTML = (state.coaches || []).map(coach => {
                const pairingIndex = (state.pairings || []).findIndex(p => p.coachId === coach.id);
                const isPaired = pairingIndex !== -1;
                const pairingColor = isPaired ? PAIRING_COLORS[pairingIndex % PAIRING_COLORS.length] : '';
                const styleStr = isPaired ? `style="border-color: ${pairingColor}33; border-left-color: ${pairingColor}; box-shadow: 0 12px 32px ${pairingColor}15, 0 0 15px ${pairingColor}08;"` : '';
                const civIds = Array.isArray(coach.civIds) ? coach.civIds : coach.civId ? [coach.civId] : [];
                const civImgs = civIds.map(id => {
                    const civUrl = getCivFlagUrl(id);
                    return civUrl ? `<img src="${civUrl}" alt="civ" class="coach-civ-icon" />` : '';
                }).join('');
                return `
                    <div id="coach-${coach.id}" class="card coach-card ${isPaired ? 'paired' : ''}" ${styleStr}>
                        <div class="card-meta">
                            <div class="card-name">${coach.name}</div>
                            <div class="coach-civ-list">${civImgs}</div>
                        </div>
                    </div>
                `;
            }).join('');

            // 3. Render Students List
            // Detect NEW pairings (not yet in arrivedPairings) -> schedule 5s delay for border
            const currentPairings = (state.pairings || []);
            const currentPairingKeys = new Set(currentPairings.map(p => `${p.coachId}-${p.studentId}`));

            // Cancel timers for pairings that no longer exist
            pendingBorderTimers.forEach((timerId, key) => {
                if (!currentPairingKeys.has(key)) {
                    clearTimeout(timerId);
                    pendingBorderTimers.delete(key);
                    arrivedPairings.delete(key);
                }
            });
            // Also remove arrived pairings that were removed
            arrivedPairings.forEach((_, key) => {
                if (!currentPairingKeys.has(key)) arrivedPairings.delete(key);
            });

            // Schedule border for each pairing
            currentPairings.forEach((pairing, index) => {
                const key = `${pairing.coachId}-${pairing.studentId}`;
                const isNew = !arrivedPairings.has(key) && !pendingBorderTimers.has(key);
                if (isNew) {
                    // New pairing: schedule border to appear after 5s (line duration)
                    const timerId = setTimeout(() => {
                        arrivedPairings.set(key, true);
                        pendingBorderTimers.delete(key);
                        // Apply border directly to the student DOM element
                        const studentEl = document.getElementById(`student-${pairing.studentId}`);
                        const pairingColor = PAIRING_COLORS[index % PAIRING_COLORS.length];
                        if (studentEl) {
                            studentEl.style.borderColor = `${pairingColor}33`;
                            studentEl.style.borderRightColor = pairingColor;
                            studentEl.style.borderRightWidth = '6px';
                            studentEl.style.borderRightStyle = 'solid';
                            studentEl.style.boxShadow = `0 12px 32px ${pairingColor}15, 0 0 15px ${pairingColor}08`;
                        }
                    }, 5000);
                    pendingBorderTimers.set(key, timerId);
                }
            });

            studentsList.innerHTML = (state.students || []).map(student => {
                const pairingIndex = currentPairings.findIndex(p => p.studentId === student.id);
                const isPaired = pairingIndex !== -1;
                const pairingColor = isPaired ? PAIRING_COLORS[pairingIndex % PAIRING_COLORS.length] : '';
                const key = isPaired ? `${currentPairings[pairingIndex].coachId}-${student.id}` : '';
                // Show border only if this pairing has already "arrived"
                const hasArrived = isPaired && arrivedPairings.has(key);
                const styleStr = hasArrived ? `style="border-color: ${pairingColor}33; border-right-color: ${pairingColor}; border-right-width: 6px; border-right-style: solid; box-shadow: 0 12px 32px ${pairingColor}15, 0 0 15px ${pairingColor}08;"` : '';
                return `
                    <div id="student-${student.id}" class="card student-card ${isPaired ? 'paired' : ''}" ${styleStr}>
                        <div class="card-name">${student.name}</div>
                    </div>
                `;
            }).join('');

            // 4. Render Casters - Single Caster center-aligned logic
            const caster = (state.casters || [])[0];
            const box = document.getElementById('cb-1');
            const name = document.getElementById('c-1-name');
            if (box && name && caster) {
                if (caster.active) {
                    box.classList.add('active');
                    if (caster.name) {
                        name.innerText = caster.name;
                        name.style.display = 'block';
                    } else {
                        name.style.display = 'none';
                    }
                } else {
                    box.classList.remove('active');
                }
            }

            // Trigger connecting line draw after DOM updates
            setTimeout(updateConnectingLines, 50);
        }

        async function init() {
            // Load initial state
            const { data } = await client.from('stream_overlays').select('state, background_url').eq('id', 'draft-matching').single();
            if (data) {
                render(data.state, data.background_url);
            }

            // Subscribe to Postgres updates
            client.channel('public:stream_overlays')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: 'id=eq.draft-matching' }, payload => {
                    render(payload.new.state, payload.new.background_url);
                })
                .subscribe();

            // Backup polling every 5s
            setInterval(async () => {
                const { data } = await client.from('stream_overlays').select('state, background_url').eq('id', 'draft-matching').single();
                if (data) render(data.state, data.background_url);
            }, 5000);

            // Re-render lines on window resize
            window.addEventListener('resize', updateConnectingLines);
            // Continuous fine tuning of lines (handles element position shifts due to rendering)
            setInterval(updateConnectingLines, 100);
        }

        init();
    </script>
</body>
</html>
