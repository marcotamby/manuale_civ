<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Matching Overlay</title>
    <!-- Outfit & Inter Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold: #d4af37;
            --gold-bright: #ffed4a;
            --blue: #0080ff;
            --bg-dark: #05080f;
            --card-bg: rgba(10, 15, 26, 0.85);
            --border-glow-gold: rgba(212, 175, 55, 0.4);
            --border-glow-blue: rgba(0, 128, 255, 0.4);
            --silver-blue: #a3c2e0;
            --silver-blue-dark: #668cb3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 1920px;
            height: 1080px;
            color: white;
            overflow: hidden;
            background: transparent url('../background/background.png') no-repeat center center/cover;
            font-family: 'Outfit', 'Inter', sans-serif;
        }

        /* Full Screen SVG for line drawing */
        #connections-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            pointer-events: none;
            z-index: 5;
        }

        /* Glowing Connection Lines with Slow Draw Animation - Thicker */
        @keyframes draw-line {
            from {
                stroke-dashoffset: 2000;
            }
            to {
                stroke-dashoffset: 0;
            }
        }

        .connection-line {
            fill: none;
            stroke-linecap: round;
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: draw-line 3.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .glow-thick {
            stroke: var(--gold);
            stroke-width: 30px;
            opacity: 0.12;
            filter: blur(10px);
        }

        .glow-medium {
            stroke: var(--gold);
            stroke-width: 12px;
            opacity: 0.35;
            filter: blur(4px);
        }

        .core-line {
            stroke: #ffffff;
            stroke-width: 4px;
            opacity: 0.95;
            filter: drop-shadow(0 0 6px var(--gold-bright));
        }

        /* Overlay Layout Header */
        #header-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        #header-title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1);
        }

        /* Columns Containers - Reduced to 360px and dynamically centered vertically */
        .side-container {
            position: absolute;
            top: 45%;
            transform: translateY(-50%);
            width: 360px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: auto;
            max-height: 600px;
        }

        #coaches-container {
            left: 120px;
        }

        #students-container {
            right: 120px;
        }

        /* Readable background for column titles just above columns */
        .column-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
            padding: 12px 24px;
            background: rgba(5, 8, 15, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .gold-text {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
        }

        .blue-text {
            color: var(--blue);
            text-shadow: 0 0 12px rgba(0, 128, 255, 0.25);
        }

        .names-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Esports Card Styles - Reduced width */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            height: 64px;
            width: 100%;
        }

        .coach-card {
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-left: 6px solid var(--gold);
        }

        .coach-card.paired {
            border-color: var(--border-glow-gold);
            box-shadow: 0 12px 32px rgba(212, 175, 55, 0.12), 0 0 15px rgba(212, 175, 55, 0.05);
        }

        .student-card {
            border: 1px solid rgba(0, 128, 255, 0.15);
            border-right: 6px solid var(--blue);
            justify-content: flex-end;
        }

        .student-card.paired {
            border-color: var(--border-glow-blue);
            box-shadow: 0 12px 32px rgba(0, 128, 255, 0.12), 0 0 15px rgba(0, 128, 255, 0.05);
        }

        .card-name {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CASTERS AREA - Separated Left & Right, centered vertical axes */
        #casters-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            height: 340px;
            pointer-events: none;
            z-index: 10;
        }

        .caster-box {
            position: absolute;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            visibility: hidden;
        }

        #cb-1 {
            left: 90px; /* Centered along same vertical axis as Coaches column */
        }

        #cb-2 {
            right: 90px; /* Centered along same vertical axis as Students column */
        }

        .caster-box.active {
            opacity: 1;
            transform: translateY(0);
            visibility: visible;
        }

        /* Webcam frame - Styled in Silver/Light Blue */
        .webcam-frame {
            width: 420px;
            height: 236px; /* 16:9 ratio, slightly larger than 380 */
            border: 2px solid var(--silver-blue);
            background: rgba(5, 8, 15, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85), inset 0 0 24px rgba(163, 194, 224, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Scanline scan effects in Silver-Blue */
        .webcam-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(163, 194, 224, 0.04) 50%, rgba(0, 0, 0, 0.08) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }

        /* Caster Nameplate - Styled in Silver/Light Blue */
        .caster-name {
            background: linear-gradient(135deg, var(--silver-blue), var(--silver-blue-dark));
            color: var(--bg-dark);
            font-weight: 900;
            padding: 8px 36px;
            font-size: 17px;
            border-radius: 30px;
            text-transform: uppercase;
            min-width: 240px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(163, 194, 224, 0.35);
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>
    <div id="header-container">
        <h1 id="header-title">MATCHMAKING DRAFT</h1>
    </div>

    <!-- Connection SVG layer -->
    <svg id="connections-svg"></svg>

    <!-- Coaches Column (Left) -->
    <div id="coaches-container" class="side-container">
        <h2 class="column-title gold-text">COACH</h2>
        <div id="coaches-list" class="names-list"></div>
    </div>

    <!-- Students Column (Right) -->
    <div id="students-container" class="side-container">
        <h2 class="column-title blue-text">ALLIEVI</h2>
        <div id="students-list" class="names-list"></div>
    </div>

    <!-- Casters Area -->
    <div id="casters-container">
        <div id="cb-1" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-1-name" class="caster-name"></div>
        </div>
        <div id="cb-2" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-2-name" class="caster-name"></div>
        </div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        
        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let lastState = null;

        function updateConnectingLines() {
            const svg = document.getElementById('connections-svg');
            
            if (!lastState || !lastState.pairings || lastState.pairings.length === 0) {
                svg.innerHTML = '';
                return;
            }

            const activeIds = new Set();
            
            lastState.pairings.forEach(pairing => {
                const coachEl = document.getElementById(`coach-${pairing.coachId}`);
                const studentEl = document.getElementById(`student-${pairing.studentId}`);
                
                if (!coachEl || !studentEl) return;
                
                const coachRect = coachEl.getBoundingClientRect();
                const studentRect = studentEl.getBoundingClientRect();
                
                // Get absolute coordinates
                const x1 = coachRect.right;
                const y1 = coachRect.top + coachRect.height / 2;
                
                const x2 = studentRect.left;
                const y2 = studentRect.top + studentRect.height / 2;
                
                const dx = x2 - x1;
                const dy = y2 - y1;
                
                // Winding "ghirigoro" path using Q and T bezier smooth chain
                const pathData = `M ${x1} ${y1} Q ${x1 + dx * 0.125} ${y1 - 60}, ${x1 + dx * 0.25} ${y1 + dy * 0.15 - 30} T ${x1 + dx * 0.5} ${y1 + dy * 0.5 + 45} T ${x1 + dx * 0.75} ${y1 + dy * 0.85 - 30} T ${x2} ${y2}`;
                
                const pairingId = `pair-${pairing.coachId}-${pairing.studentId}`;
                activeIds.add(pairingId);

                // Find or create group element
                let group = document.getElementById(pairingId);
                if (!group) {
                    group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    group.setAttribute('id', pairingId);

                    const glowThick = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    glowThick.setAttribute('class', 'connection-line glow-thick');

                    const glowMedium = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    glowMedium.setAttribute('class', 'connection-line glow-medium');

                    const coreLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    coreLine.setAttribute('class', 'connection-line core-line');

                    group.appendChild(glowThick);
                    group.appendChild(glowMedium);
                    group.appendChild(coreLine);

                    svg.appendChild(group);
                }

                // Update paths d attribute
                const paths = group.querySelectorAll('path');
                paths.forEach(path => {
                    path.setAttribute('d', pathData);
                });
            });

            // Remove groups that are no longer paired
            const existingGroups = svg.querySelectorAll('g');
            existingGroups.forEach(g => {
                const id = g.getAttribute('id');
                if (!activeIds.has(id)) {
                    svg.removeChild(g);
                }
            });
        }

        function render(state, backgroundUrl) {
            // Background image handling
            if (backgroundUrl) {
                document.body.style.backgroundImage = `url(${backgroundUrl})`;
            } else {
                document.body.style.backgroundImage = "url('../background/background.png')";
            }

            if (!state) return;
            lastState = state;
            console.log("Rendering state:", state);

            // 1. Render Coaches List
            const coachesList = document.getElementById('coaches-list');
            coachesList.innerHTML = (state.coaches || []).map(coach => {
                const isPaired = (state.pairings || []).some(p => p.coachId === coach.id);
                return `
                    <div id="coach-${coach.id}" class="card coach-card ${isPaired ? 'paired' : ''}">
                        <div class="card-name">${coach.name}</div>
                    </div>
                `;
            }).join('');

            // 2. Render Students List
            const studentsList = document.getElementById('students-list');
            studentsList.innerHTML = (state.students || []).map(student => {
                const isPaired = (state.pairings || []).some(p => p.studentId === student.id);
                return `
                    <div id="student-${student.id}" class="card student-card ${isPaired ? 'paired' : ''}">
                        <div class="card-name">${student.name}</div>
                    </div>
                `;
            }).join('');

            // 3. Render Casters - Fixed toggle and silver-blue styling
            (state.casters || []).forEach((c, idx) => {
                const box = document.getElementById(`cb-${idx+1}`);
                const name = document.getElementById(`c-${idx+1}-name`);
                if (box && name) {
                    if (c.active) {
                        box.classList.add('active');
                        if (c.name) {
                            name.innerText = c.name;
                            name.style.display = 'block';
                        } else {
                            name.style.display = 'none';
                        }
                    } else {
                        box.classList.remove('active');
                    }
                }
            });

            // Trigger connecting line draw after DOM updates
            setTimeout(updateConnectingLines, 50);
        }

        async function init() {
            // Load initial state
            const { data } = await client.from('stream_overlays').select('state, background_url').eq('id', 'draft-matching').single();
            if (data) {
                render(data.state, data.background_url);
            }

            // Subscribe to Postgres updates
            client.channel('public:stream_overlays')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: 'id=eq.draft-matching' }, payload => {
                    render(payload.new.state, payload.new.background_url);
                })
                .subscribe();

            // Backup polling every 5s
            setInterval(async () => {
                const { data } = await client.from('stream_overlays').select('state, background_url').eq('id', 'draft-matching').single();
                if (data) render(data.state, data.background_url);
            }, 5000);

            // Re-render lines on window resize
            window.addEventListener('resize', updateConnectingLines);
            // Continuous fine tuning of lines (handles element position shifts due to rendering)
            setInterval(updateConnectingLines, 100);
        }

        init();
    </script>
</body>
</html>
