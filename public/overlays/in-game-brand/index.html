<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>In-Game Brand Overlay - AoE Italia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fondamento:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-main: #d4af37;
            --gold-bright: #ffd700;
            --gold-glow: rgba(212, 175, 55, 0.45);
            --cyan-main: #00d2ff;
            --cyan-bright: #38bdf8;
            --cyan-glow: rgba(0, 210, 255, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            position: relative;
            user-select: none;
        }

        /* =========================================================================
           1. TOP BANNER (NOME DEL TORNEO - Sotto al Timer Spettatore)
           ========================================================================= */
        #top-brand-banner {
            position: absolute;
            top: 136px;
            left: 50%;
            transform: translateX(-50%);
            width: 296px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #090e1c 0%, #040711 100%);
            border: 2px solid var(--gold-main);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.95), 0 0 15px rgba(212, 175, 55, 0.25);
            z-index: 100;
            padding: 0 8px;
            transition: all 0.2s ease;
        }

        .top-tournament-title {
            font-family: 'Fondamento', 'Eagle Lake', 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1.2px;
            background: linear-gradient(180deg, #ffffff 0%, #fff176 30%, #ffa726 65%, #ff5722 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 14px rgba(255, 167, 38, 0.4));
            white-space: nowrap;
            text-align: center;
            line-height: 1;
        }

        /* =========================================================================
           2. MINIMAP UNIFIED FRAME & PANELS (Pure 1:1 45° Diamond Geometry - Raised)
           ========================================================================= */
        #minimap-brand-wrapper {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 444px;
            height: 444px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .minimap-wrapper-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(-4px 4px 15px rgba(0, 0, 0, 0.9));
        }

        /* Logo AoE Italia Top-Right Content */
        .minimap-logo-content {
            position: absolute;
            top: 20px;
            right: 4px;
            width: 140px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .minimap-logo-img {
            max-height: 72px;
            max-width: 125px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 10px rgba(212, 175, 55, 0.35));
        }

        /* Map Name & Day Bottom-Right Content */
        .minimap-bottom-content {
            position: absolute;
            bottom: 14px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            z-index: 2;
        }

        .minimap-map-name {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            text-transform: capitalize;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 1), 0 0 12px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
        }

        .minimap-day-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--cyan-bright);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--cyan-glow), 0 2px 4px rgba(0, 0, 0, 1);
            margin-top: 4px;
        }

        .hidden-element {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. TOP BRAND BANNER (Solo nome torneo - Sotto HUD Timer) -->
    <div id="top-brand-banner">
        <div class="top-tournament-title" id="top-title-text">Ends of Summer Champions</div>
    </div>

    <!-- 2. MINIMAP COMPLETE BRAND WRAPPER (1:1 45° Diamond Alzato per Eliminare Gap) -->
    <div id="minimap-brand-wrapper">
        <svg class="minimap-wrapper-svg" viewBox="0 0 444 444" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0b1224" stop-opacity="0.98"/>
                    <stop offset="100%" stop-color="#040711" stop-opacity="0.98"/>
                </linearGradient>
                <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffd700"/>
                    <stop offset="50%" stop-color="#d4af37"/>
                    <stop offset="100%" stop-color="#aa8c2c"/>
                </linearGradient>
            </defs>

            <!-- 1. Top-Right Panel (copre toggle Y=0..66 e diagonale 45° a 428,242) -->
            <g id="svg-minimap-top-group">
                <polygon points="252,0 444,0 444,252 428,242 252,66" fill="url(#panelBg)"/>
                <line x1="252" y1="66" x2="428" y2="242" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- 2. Bottom-Right Panel (diagonale 45° rialzata da 428,242 a 252,418) -->
            <g id="svg-minimap-bottom-group">
                <polygon points="428,242 444,232 444,444 252,444 252,418" fill="url(#panelBg)"/>
                <line x1="428" y1="242" x2="252" y2="418" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- 3. Outer Scalloped / Starburst Dark Frame (Lato Sinistro 1:1 45° Alzato) -->
            <g id="svg-minimap-frame-group">
                <polygon points="248.5,62.5 224.6,67.9 219.1,91.8 195.3,97.3 189.8,121.1 165.9,126.6 160.5,150.5 136.6,155.9 131.1,179.8 107.3,185.3 101.8,209.1 77.9,214.6 72.5,238.5 77.9,269.4 101.8,274.9 107.3,298.7 131.1,304.2 136.6,328.1 160.5,333.5 165.9,357.4 189.8,362.9 195.3,386.7 219.1,392.2 224.6,416.1 248.5,421.5 252,418 76,242 252,66" fill="url(#panelBg)"/>
                <!-- Outer Jagged Gold Line -->
                <polyline points="248.5,62.5 224.6,67.9 219.1,91.8 195.3,97.3 189.8,121.1 165.9,126.6 160.5,150.5 136.6,155.9 131.1,179.8 107.3,185.3 101.8,209.1 77.9,214.6 72.5,238.5 77.9,269.4 101.8,274.9 107.3,298.7 131.1,304.2 136.6,328.1 160.5,333.5 165.9,357.4 189.8,362.9 195.3,386.7 219.1,392.2 224.6,416.1 248.5,421.5" stroke="url(#goldStroke)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Inner Diamond Left Gold Line -->
                <polyline points="252,418 76,242 252,66" stroke="url(#goldStroke)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </svg>

        <!-- AoE Italia Logo (Top-Right) -->
        <div class="minimap-logo-content" id="minimap-logo-content">
            <img src="/aoeitalia-logo.png" alt="AoE Italia" class="minimap-logo-img">
        </div>

        <!-- Map & Day Info (Bottom-Right) -->
        <div class="minimap-bottom-content" id="minimap-info-content">
            <div class="minimap-map-name" id="minimap-map-name">Dry Arabia</div>
            <div class="minimap-day-text" id="minimap-day-text">Giornata 1</div>
        </div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "in-game-brand";

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        function formatTitle(raw) {
            if (!raw) return 'Ends of Summer Champions';
            const lowerWords = ['of', 'dei', 'del', 'della', 'degli', 'delle', 'di', 'da', 'in', 'and', 'the', 'e', 'a', 'su', 'per', 'con', 'tra', 'fra'];
            return raw.trim().split(/\s+/).map((word, index) => {
                const wLower = word.toLowerCase();
                if (index > 0 && lowerWords.includes(wLower)) {
                    return wLower;
                }
                if (word === word.toUpperCase() && word.length > 2) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function render(state, displayName) {
            const s = state || {};

            // 1. Titles & Day
            const title = displayName || s.tournamentTitle || s.titleText || 'Ends of Summer Champions';
            const formattedTitle = formatTitle(title);
            const mapName = s.mapName || 'Dry Arabia';
            const dayNum = s.dayNumber !== undefined ? s.dayNumber : 1;
            const dayText = s.dayText || `Giornata ${dayNum}`;

            // Top Banner Element
            const topBanner = document.getElementById('top-brand-banner');
            document.getElementById('top-title-text').innerText = formattedTitle;

            // Minimap Elements
            const minimapWrapper = document.getElementById('minimap-brand-wrapper');
            const minimapTopGroup = document.getElementById('svg-minimap-top-group');
            const minimapBottomGroup = document.getElementById('svg-minimap-bottom-group');
            const minimapLogo = document.getElementById('minimap-logo-content');
            const minimapInfo = document.getElementById('minimap-info-content');
            const minimapDay = document.getElementById('minimap-day-text');
            const minimapMap = document.getElementById('minimap-map-name');

            minimapDay.innerText = dayText;
            minimapMap.innerText = mapName;

            // Visibility Toggles
            if (s.showTopBanner === false) {
                topBanner.classList.add('hidden-element');
            } else {
                topBanner.classList.remove('hidden-element');
            }

            if (s.showMinimapCrest === false) {
                if (minimapTopGroup) minimapTopGroup.classList.add('hidden-element');
                if (minimapLogo) minimapLogo.classList.add('hidden-element');
            } else {
                if (minimapTopGroup) minimapTopGroup.classList.remove('hidden-element');
                if (minimapLogo) minimapLogo.classList.remove('hidden-element');
            }

            if (s.showMinimapInfo === false) {
                if (minimapBottomGroup) minimapBottomGroup.classList.add('hidden-element');
                if (minimapInfo) minimapInfo.classList.add('hidden-element');
            } else {
                if (minimapBottomGroup) minimapBottomGroup.classList.remove('hidden-element');
                if (minimapInfo) minimapInfo.classList.remove('hidden-element');
            }

            // Fine-tune offsets
            if (s.topBannerOffsetY !== undefined) {
                topBanner.style.top = `${136 + Number(s.topBannerOffsetY)}px`;
            }
            if (s.minimapBottomOffsetY !== undefined) {
                minimapWrapper.style.bottom = `${0 + Number(s.minimapBottomOffsetY)}px`;
            }
        }

        async function init() {
            try {
                const { data, error } = await client
                    .from('stream_overlays')
                    .select('state, display_name')
                    .eq('id', OVERLAY_ID)
                    .single();

                if (!error && data) {
                    render(data.state, data.display_name);
                } else {
                    render({});
                }

                client
                    .channel(`overlay-${OVERLAY_ID}`)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'stream_overlays',
                        filter: `id=eq.${OVERLAY_ID}`
                    }, (payload) => {
                        const rec = payload.new;
                        if (rec) render(rec.state, rec.display_name);
                    })
                    .subscribe();

            } catch (err) {
                console.error("Errore init in-game-brand:", err);
                render({});
            }
        }

        init();
    </script>
</body>
</html>
