<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>In-Game Brand Overlay - AoE Italia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fondamento:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-main: #d4af37;
            --gold-bright: #ffd700;
            --gold-glow: rgba(212, 175, 55, 0.45);
            --cyan-main: #00d2ff;
            --cyan-bright: #38bdf8;
            --cyan-glow: rgba(0, 210, 255, 0.45);
            --bg-glass: rgba(7, 12, 22, 0.92);
            --border-glass: rgba(212, 175, 55, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            position: relative;
            user-select: none;
        }

        body.with-reference-bg {
            background: url('reference_ingame.jpg') no-repeat center center / cover !important;
        }

        /* =========================================================================
           1. TOP BANNER (SOLO NOME DEL TORNEO)
           ========================================================================= */
        #top-brand-banner {
            position: absolute;
            top: 124px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--border-glass);
            border-top: none;
            border-radius: 0 0 14px 14px;
            padding: 5px 26px 7px 26px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 0, 0, 0.6);
            z-index: 100;
            transition: all 0.25s ease;
        }

        #top-brand-banner::before,
        #top-brand-banner::after {
            content: '';
            position: absolute;
            top: 0;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--gold-bright);
        }
        #top-brand-banner::before {
            left: -10px;
            border-right: 2px solid var(--gold-bright);
            border-top-right-radius: 6px;
        }
        #top-brand-banner::after {
            right: -10px;
            border-left: 2px solid var(--gold-bright);
            border-top-left-radius: 6px;
        }

        .top-tournament-title {
            font-family: 'Fondamento', 'Eagle Lake', 'Cinzel', serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #ffffff 0%, #fff176 30%, #ffa726 65%, #ff5722 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(255, 167, 38, 0.4));
            white-space: nowrap;
            text-align: center;
        }

        /* =========================================================================
           2. DI FIANCO ALLA MINIMAPPA (LOGO + GIORNATA + NOME MAPPA)
           ========================================================================= */
        #minimap-brand-sidebar {
            position: absolute;
            right: 14px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            z-index: 100;
            pointer-events: none;
            gap: 6px;
            transition: all 0.25s ease;
        }

        .minimap-logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.95) 0%, rgba(18, 24, 40, 0.88) 100%);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--gold-main);
            border-radius: 12px;
            padding: 6px 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.25);
            margin-bottom: 2px;
        }

        .minimap-logo-img {
            height: 38px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.85));
        }

        .minimap-day-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.45);
            color: var(--cyan-bright);
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1.5px;
            padding: 3px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3), 0 2px 6px rgba(0, 0, 0, 0.9);
            text-shadow: 0 0 6px var(--cyan-glow);
        }

        .minimap-map-name {
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: capitalize;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 0, 0, 0.95), 0 0 18px rgba(0, 0, 0, 0.95);
            line-height: 1.15;
        }

        .hidden-element {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. TOP BRAND BANNER (Solo nome torneo) -->
    <div id="top-brand-banner">
        <div class="top-tournament-title" id="top-title-text">Ends of Summer Champions</div>
    </div>

    <!-- 2. MINIMAP SIDEBAR (Logo + Giornata + Mappa) -->
    <div id="minimap-brand-sidebar">
        <div class="minimap-logo-box" id="minimap-logo-container">
            <img src="/aoeitalia-logo.png" alt="AoE Italia" class="minimap-logo-img">
        </div>
        <div class="minimap-day-badge" id="minimap-day-badge">GIORNATA 1</div>
        <div class="minimap-map-name" id="minimap-map-name">Dry Arabia</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "in-game-brand";

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('preview') === 'true' || urlParams.get('bg') === 'true') {
            document.body.classList.add('with-reference-bg');
        }

        function formatTitle(raw) {
            if (!raw) return 'Ends of Summer Champions';
            const lowerWords = ['of', 'dei', 'del', 'della', 'degli', 'delle', 'di', 'da', 'in', 'and', 'the', 'e', 'a', 'su', 'per', 'con', 'tra', 'fra'];
            return raw.trim().split(/\s+/).map((word, index) => {
                const wLower = word.toLowerCase();
                if (index > 0 && lowerWords.includes(wLower)) {
                    return wLower;
                }
                if (word === word.toUpperCase() && word.length > 2) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function render(state, displayName) {
            const s = state || {};

            // 1. Titles & Day
            const title = displayName || s.tournamentTitle || s.titleText || 'Ends of Summer Champions';
            const formattedTitle = formatTitle(title);
            const mapName = s.mapName || 'Dry Arabia';
            const dayNum = s.dayNumber !== undefined ? s.dayNumber : 1;
            const dayText = s.dayText || `GIORNATA ${dayNum}`;

            // Top Banner Element
            const topBanner = document.getElementById('top-brand-banner');
            document.getElementById('top-title-text').innerText = formattedTitle;

            // Minimap Elements
            const minimapSidebar = document.getElementById('minimap-brand-sidebar');
            const minimapLogo = document.getElementById('minimap-logo-container');
            const minimapDay = document.getElementById('minimap-day-badge');
            const minimapMap = document.getElementById('minimap-map-name');

            minimapDay.innerText = dayText;
            minimapMap.innerText = mapName;

            // Visibility Toggles
            if (s.showTopBanner === false) {
                topBanner.classList.add('hidden-element');
            } else {
                topBanner.classList.remove('hidden-element');
            }

            if (s.showMinimapBrand === false) {
                minimapSidebar.classList.add('hidden-element');
            } else {
                minimapSidebar.classList.remove('hidden-element');
            }

            if (s.showMinimapLogo === false) {
                minimapLogo.classList.add('hidden-element');
            } else {
                minimapLogo.classList.remove('hidden-element');
            }

            if (s.showMinimapDay === false) {
                minimapDay.classList.add('hidden-element');
            } else {
                minimapDay.classList.remove('hidden-element');
            }

            if (s.showMinimapMapName === false) {
                minimapMap.classList.add('hidden-element');
            } else {
                minimapMap.classList.remove('hidden-element');
            }

            // Fine-tune offsets
            if (s.topBannerOffsetY !== undefined) {
                topBanner.style.top = `${124 + Number(s.topBannerOffsetY)}px`;
            }
            if (s.minimapSidebarOffsetY !== undefined) {
                minimapSidebar.style.bottom = `${12 + Number(s.minimapSidebarOffsetY)}px`;
            }
            if (s.minimapSidebarOffsetX !== undefined) {
                minimapSidebar.style.right = `${14 + Number(s.minimapSidebarOffsetX)}px`;
            }
        }

        async function init() {
            try {
                const { data, error } = await client
                    .from('stream_overlays')
                    .select('state, display_name')
                    .eq('id', OVERLAY_ID)
                    .single();

                if (!error && data) {
                    render(data.state, data.display_name);
                } else {
                    render({});
                }

                client
                    .channel(`overlay-${OVERLAY_ID}`)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'stream_overlays',
                        filter: `id=eq.${OVERLAY_ID}`
                    }, (payload) => {
                        const rec = payload.new;
                        if (rec) render(rec.state, rec.display_name);
                    })
                    .subscribe();

            } catch (err) {
                console.error("Errore init in-game-brand:", err);
                render({});
            }
        }

        init();
    </script>
</body>
</html>
