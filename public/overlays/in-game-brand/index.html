<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>In-Game Brand Overlay - AoE Italia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fondamento:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-main: #d4af37;
            --gold-bright: #ffd700;
            --gold-glow: rgba(212, 175, 55, 0.45);
            --cyan-main: #00d2ff;
            --cyan-bright: #38bdf8;
            --cyan-glow: rgba(0, 210, 255, 0.45);
            --bg-glass: rgba(7, 12, 22, 0.94);
            --border-glass: rgba(212, 175, 55, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            position: relative;
            user-select: none;
        }

        /* =========================================================================
           1. TOP BANNER (SOLO NOME DEL TORNEO - Continuazione HUD di Gioco)
           ========================================================================= */
        #top-brand-banner {
            position: absolute;
            top: 124px;
            left: 50%;
            transform: translateX(-50%);
            width: 310px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(10, 15, 28, 0.98) 0%, rgba(5, 8, 16, 0.98) 100%);
            border: 2px solid var(--gold-main);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 100;
            padding: 0 12px;
            transition: all 0.25s ease;
        }

        .top-tournament-title {
            font-family: 'Fondamento', 'Eagle Lake', 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #ffffff 0%, #fff176 30%, #ffa726 65%, #ff5722 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 18px rgba(255, 167, 38, 0.4));
            white-space: nowrap;
            text-align: center;
            line-height: 1;
        }

        /* =========================================================================
           2. CREST LOGO AOE ITALIA (Top-Right of Minimap Diamond)
           ========================================================================= */
        #minimap-crest-badge {
            position: absolute;
            right: 0;
            top: 625px;
            width: 148px;
            height: 96px;
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.96) 0%, rgba(16, 22, 38, 0.92) 100%);
            backdrop-filter: blur(12px);
            border: 2px solid var(--gold-main);
            border-right: none;
            clip-path: polygon(35px 0, 100% 0, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px 8px 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.9), 0 0 18px rgba(212, 175, 55, 0.3);
            z-index: 100;
            transition: all 0.25s ease;
        }

        .minimap-logo-img {
            height: 54px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.9));
        }

        /* =========================================================================
           3. AREA SCURA SOTTO LA MINIMAPPA (Hugging Minimap Perimeter)
           ========================================================================= */
        #minimap-bottom-corner-panel {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 290px;
            height: 120px;
            background: linear-gradient(135deg, rgba(7, 12, 22, 0.96) 0%, rgba(12, 18, 32, 0.94) 100%);
            backdrop-filter: blur(14px);
            border-top: 2px solid var(--gold-main);
            border-left: 2px solid var(--gold-main);
            clip-path: polygon(95px 0, 100% 0, 100% 100%, 0 100%);
            box-shadow: -4px -4px 25px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            padding: 12px 20px 14px 30px;
            text-align: right;
            z-index: 100;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .minimap-map-name {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            text-transform: capitalize;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 1);
            line-height: 1.15;
        }

        .minimap-day-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--cyan-bright);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--cyan-glow), 0 2px 6px rgba(0, 0, 0, 1);
            margin-top: 3px;
        }

        .hidden-element {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. TOP BRAND BANNER (Solo nome torneo) -->
    <div id="top-brand-banner">
        <div class="top-tournament-title" id="top-title-text">Ends of Summer Champions</div>
    </div>

    <!-- 2. CREST LOGO AOE ITALIA (In alto a destra sulla minimappa) -->
    <div id="minimap-crest-badge">
        <img src="/aoeitalia-logo.png" alt="AoE Italia" class="minimap-logo-img">
    </div>

    <!-- 3. AREA SCURA SOTTO LA MINIMAPPA (Giornata + Nome Mappa) -->
    <div id="minimap-bottom-corner-panel">
        <div class="minimap-map-name" id="minimap-map-name">Dry Arabia</div>
        <div class="minimap-day-text" id="minimap-day-text">Giornata 1</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "in-game-brand";

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        function formatTitle(raw) {
            if (!raw) return 'Ends of Summer Champions';
            const lowerWords = ['of', 'dei', 'del', 'della', 'degli', 'delle', 'di', 'da', 'in', 'and', 'the', 'e', 'a', 'su', 'per', 'con', 'tra', 'fra'];
            return raw.trim().split(/\s+/).map((word, index) => {
                const wLower = word.toLowerCase();
                if (index > 0 && lowerWords.includes(wLower)) {
                    return wLower;
                }
                if (word === word.toUpperCase() && word.length > 2) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function render(state, displayName) {
            const s = state || {};

            // 1. Titles & Day
            const title = displayName || s.tournamentTitle || s.titleText || 'Ends of Summer Champions';
            const formattedTitle = formatTitle(title);
            const mapName = s.mapName || 'Dry Arabia';
            const dayNum = s.dayNumber !== undefined ? s.dayNumber : 1;
            const dayText = s.dayText || `Giornata ${dayNum}`;

            // Top Banner Element
            const topBanner = document.getElementById('top-brand-banner');
            document.getElementById('top-title-text').innerText = formattedTitle;

            // Minimap Elements
            const minimapCrest = document.getElementById('minimap-crest-badge');
            const minimapBottom = document.getElementById('minimap-bottom-corner-panel');
            const minimapDay = document.getElementById('minimap-day-text');
            const minimapMap = document.getElementById('minimap-map-name');

            minimapDay.innerText = dayText;
            minimapMap.innerText = mapName;

            // Visibility Toggles
            if (s.showTopBanner === false) {
                topBanner.classList.add('hidden-element');
            } else {
                topBanner.classList.remove('hidden-element');
            }

            if (s.showMinimapCrest === false) {
                minimapCrest.classList.add('hidden-element');
            } else {
                minimapCrest.classList.remove('hidden-element');
            }

            if (s.showMinimapInfo === false) {
                minimapBottom.classList.add('hidden-element');
            } else {
                minimapBottom.classList.remove('hidden-element');
            }

            // Fine-tune offsets
            if (s.topBannerOffsetY !== undefined) {
                topBanner.style.top = `${124 + Number(s.topBannerOffsetY)}px`;
            }
            if (s.minimapCrestOffsetY !== undefined) {
                minimapCrest.style.top = `${625 + Number(s.minimapCrestOffsetY)}px`;
            }
            if (s.minimapBottomOffsetY !== undefined) {
                minimapBottom.style.bottom = `${0 + Number(s.minimapBottomOffsetY)}px`;
            }
        }

        async function init() {
            try {
                const { data, error } = await client
                    .from('stream_overlays')
                    .select('state, display_name')
                    .eq('id', OVERLAY_ID)
                    .single();

                if (!error && data) {
                    render(data.state, data.display_name);
                } else {
                    render({});
                }

                client
                    .channel(`overlay-${OVERLAY_ID}`)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'stream_overlays',
                        filter: `id=eq.${OVERLAY_ID}`
                    }, (payload) => {
                        const rec = payload.new;
                        if (rec) render(rec.state, rec.display_name);
                    })
                    .subscribe();

            } catch (err) {
                console.error("Errore init in-game-brand:", err);
                render({});
            }
        }

        init();
    </script>
</body>
</html>
