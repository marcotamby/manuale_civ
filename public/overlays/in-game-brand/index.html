<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>In-Game Brand Overlay - AoE Italia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fondamento:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-main: #d4af37;
            --gold-bright: #ffd700;
            --gold-glow: rgba(212, 175, 55, 0.5);
            --cyan-main: #00d2ff;
            --cyan-bright: #38bdf8;
            --cyan-glow: rgba(0, 210, 255, 0.5);
            --panel-bg: linear-gradient(145deg, rgba(8, 13, 24, 0.98) 0%, rgba(4, 7, 15, 0.98) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent !important;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            position: relative;
            user-select: none;
        }

        /* =========================================================================
           1. TOP BANNER (NOME DEL TORNEO - Continuazione Seamless HUD Spettatore)
           ========================================================================= */
        #top-brand-banner {
            position: absolute;
            top: 118px;
            left: 50%;
            transform: translateX(-50%);
            width: 306px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #090e1c 0%, #040711 100%);
            border: 2px solid var(--gold-main);
            border-top: none;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.95), 0 0 15px rgba(212, 175, 55, 0.25);
            z-index: 100;
            padding: 0 10px;
            transition: all 0.2s ease;
        }

        .top-tournament-title {
            font-family: 'Fondamento', 'Eagle Lake', 'Cinzel', serif;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 1.2px;
            background: linear-gradient(180deg, #ffffff 0%, #fff176 30%, #ffa726 65%, #ff5722 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 14px rgba(255, 167, 38, 0.4));
            white-space: nowrap;
            text-align: center;
            line-height: 1;
        }

        /* =========================================================================
           2. MINIMAP TOP-RIGHT CORNER (AoEItalia Logo - Sagomato a 45°)
           ========================================================================= */
        #minimap-crest-badge {
            position: absolute;
            right: 0;
            top: 575px;
            width: 225px;
            height: 240px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .minimap-crest-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(-4px 4px 15px rgba(0, 0, 0, 0.9));
        }

        .minimap-crest-content {
            position: absolute;
            top: 15px;
            right: 18px;
            width: 135px;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .minimap-logo-img {
            max-height: 72px;
            max-width: 120px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 10px rgba(212, 175, 55, 0.35));
        }

        /* =========================================================================
           3. MINIMAP BOTTOM-RIGHT CORNER (Mappa & Giornata - Sagomato a 45°)
           ========================================================================= */
        #minimap-bottom-corner-panel {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 235px;
            height: 290px;
            z-index: 100;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .minimap-bottom-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(-4px -4px 15px rgba(0, 0, 0, 0.9));
        }

        .minimap-bottom-content {
            position: absolute;
            bottom: 14px;
            right: 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            z-index: 2;
        }

        .minimap-map-name {
            font-family: 'Inter', sans-serif;
            font-size: 23px;
            font-weight: 900;
            letter-spacing: 0.8px;
            color: #ffffff;
            text-transform: capitalize;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 1), 0 0 12px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
        }

        .minimap-day-text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: var(--cyan-bright);
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--cyan-glow), 0 2px 4px rgba(0, 0, 0, 1);
            margin-top: 4px;
        }

        .hidden-element {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. TOP BRAND BANNER (Solo nome torneo - Continuazione HUD) -->
    <div id="top-brand-banner">
        <div class="top-tournament-title" id="top-title-text">Ends of Summer Champions</div>
    </div>

    <!-- 2. CREST LOGO AOE ITALIA (In alto a destra sulla minimappa) -->
    <div id="minimap-crest-badge">
        <svg class="minimap-crest-svg" viewBox="0 0 225 240" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0b1224" stop-opacity="0.98"/>
                    <stop offset="100%" stop-color="#040711" stop-opacity="0.98"/>
                </linearGradient>
                <linearGradient id="goldStroke" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffd700"/>
                    <stop offset="50%" stop-color="#d4af37"/>
                    <stop offset="100%" stop-color="#aa8c2c"/>
                </linearGradient>
            </defs>
            <!-- Background Shape: starts top-left (0,0), across top to (225,0), down right to (225,235), diagonal up-left to (0,75) -->
            <polygon points="0,0 225,0 225,235 0,75" fill="url(#crestBg)"/>
            <!-- Golden border line along the minimap diagonal -->
            <line x1="0" y1="75" x2="225" y2="235" stroke="url(#goldStroke)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="minimap-crest-content">
            <img src="/aoeitalia-logo.png" alt="AoE Italia" class="minimap-logo-img">
        </div>
    </div>

    <!-- 3. AREA SCURA SOTTO LA MINIMAPPA (Giornata + Nome Mappa) -->
    <div id="minimap-bottom-corner-panel">
        <svg class="minimap-bottom-svg" viewBox="0 0 235 290" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="bottomBg" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#0b1224" stop-opacity="0.98"/>
                    <stop offset="100%" stop-color="#040711" stop-opacity="0.98"/>
                </linearGradient>
                <linearGradient id="bottomGold" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#aa8c2c"/>
                    <stop offset="50%" stop-color="#d4af37"/>
                    <stop offset="100%" stop-color="#ffd700"/>
                </linearGradient>
            </defs>
            <!-- Background Shape: diagonal from (235,5) down-left to (0,165), down to (0,290), across to (235,290) -->
            <polygon points="235,5 0,165 0,290 235,290" fill="url(#bottomBg)"/>
            <!-- Golden border line along the minimap diagonal -->
            <line x1="235" y1="5" x2="0" y2="165" stroke="url(#bottomGold)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="minimap-bottom-content">
            <div class="minimap-map-name" id="minimap-map-name">Dry Arabia</div>
            <div class="minimap-day-text" id="minimap-day-text">Giornata 1</div>
        </div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "in-game-brand";

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        function formatTitle(raw) {
            if (!raw) return 'Ends of Summer Champions';
            const lowerWords = ['of', 'dei', 'del', 'della', 'degli', 'delle', 'di', 'da', 'in', 'and', 'the', 'e', 'a', 'su', 'per', 'con', 'tra', 'fra'];
            return raw.trim().split(/\s+/).map((word, index) => {
                const wLower = word.toLowerCase();
                if (index > 0 && lowerWords.includes(wLower)) {
                    return wLower;
                }
                if (word === word.toUpperCase() && word.length > 2) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function render(state, displayName) {
            const s = state || {};

            // 1. Titles & Day
            const title = displayName || s.tournamentTitle || s.titleText || 'Ends of Summer Champions';
            const formattedTitle = formatTitle(title);
            const mapName = s.mapName || 'Dry Arabia';
            const dayNum = s.dayNumber !== undefined ? s.dayNumber : 1;
            const dayText = s.dayText || `Giornata ${dayNum}`;

            // Top Banner Element
            const topBanner = document.getElementById('top-brand-banner');
            document.getElementById('top-title-text').innerText = formattedTitle;

            // Minimap Elements
            const minimapCrest = document.getElementById('minimap-crest-badge');
            const minimapBottom = document.getElementById('minimap-bottom-corner-panel');
            const minimapDay = document.getElementById('minimap-day-text');
            const minimapMap = document.getElementById('minimap-map-name');

            minimapDay.innerText = dayText;
            minimapMap.innerText = mapName;

            // Visibility Toggles
            if (s.showTopBanner === false) {
                topBanner.classList.add('hidden-element');
            } else {
                topBanner.classList.remove('hidden-element');
            }

            if (s.showMinimapCrest === false) {
                minimapCrest.classList.add('hidden-element');
            } else {
                minimapCrest.classList.remove('hidden-element');
            }

            if (s.showMinimapInfo === false) {
                minimapBottom.classList.add('hidden-element');
            } else {
                minimapBottom.classList.remove('hidden-element');
            }

            // Fine-tune offsets
            if (s.topBannerOffsetY !== undefined) {
                topBanner.style.top = `${118 + Number(s.topBannerOffsetY)}px`;
            }
            if (s.minimapCrestOffsetY !== undefined) {
                minimapCrest.style.top = `${575 + Number(s.minimapCrestOffsetY)}px`;
            }
            if (s.minimapBottomOffsetY !== undefined) {
                minimapBottom.style.bottom = `${0 + Number(s.minimapBottomOffsetY)}px`;
            }
        }

        async function init() {
            try {
                const { data, error } = await client
                    .from('stream_overlays')
                    .select('state, display_name')
                    .eq('id', OVERLAY_ID)
                    .single();

                if (!error && data) {
                    render(data.state, data.display_name);
                } else {
                    render({});
                }

                client
                    .channel(`overlay-${OVERLAY_ID}`)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'stream_overlays',
                        filter: `id=eq.${OVERLAY_ID}`
                    }, (payload) => {
                        const rec = payload.new;
                        if (rec) render(rec.state, rec.display_name);
                    })
                    .subscribe();

            } catch (err) {
                console.error("Errore init in-game-brand:", err);
                render({});
            }
        }

        init();
    </script>
</body>
</html>
