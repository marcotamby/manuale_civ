<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>In-Game Brand Overlay - AoE Italia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fondamento:ital@0;1&family=Inter:wght@400;500;600;700;800;900&family=MedievalSharp&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-main: #d4af37;
            --gold-bright: #ffd700;
            --gold-glow: rgba(212, 175, 55, 0.45);
            --cyan-main: #00d2ff;
            --cyan-bright: #38bdf8;
            --cyan-glow: rgba(0, 210, 255, 0.45);
            --orange-bright: #fb923c;
            --ember-glow: rgba(249, 115, 22, 0.4);
            --bg-glass: rgba(7, 12, 22, 0.9);
            --border-glass: rgba(212, 175, 55, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            position: relative;
            user-select: none;
        }

        body.with-reference-bg {
            background: url('reference_ingame.jpg') no-repeat center center / cover !important;
        }

        /* =========================================================================
           1. TOP BANNER (Under Spectator Top HUD)
           ========================================================================= */
        #top-brand-banner {
            position: absolute;
            top: 124px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--border-glass);
            border-top: none;
            border-radius: 0 0 14px 14px;
            padding: 6px 20px 7px 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85), 0 0 20px rgba(0, 0, 0, 0.6);
            z-index: 100;
            transition: all 0.3s ease;
        }

        #top-brand-banner::before,
        #top-brand-banner::after {
            content: '';
            position: absolute;
            top: 0;
            width: 10px;
            height: 10px;
            border-top: 2px solid var(--gold-bright);
        }
        #top-brand-banner::before {
            left: -10px;
            border-right: 2px solid var(--gold-bright);
            border-top-right-radius: 6px;
        }
        #top-brand-banner::after {
            right: -10px;
            border-left: 2px solid var(--gold-bright);
            border-top-left-radius: 6px;
        }

        .top-logo-img {
            height: 28px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
        }

        .top-divider {
            width: 1.5px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, var(--gold-bright), transparent);
            opacity: 0.8;
        }

        .top-titles-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1.1;
        }

        .top-tournament-title {
            font-family: 'Fondamento', 'Eagle Lake', 'Cinzel', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #ffffff 0%, #fff176 30%, #ffa726 65%, #ff5722 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9));
            white-space: nowrap;
        }

        .top-sub-badge {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cyan-bright);
            text-shadow: 0 0 8px var(--cyan-glow);
        }

        .top-format-pill {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: var(--cyan-bright);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
            white-space: nowrap;
        }

        /* =========================================================================
           2. MINIMAP BRAND BADGE (Top-Right of Minimap Diamond)
           ========================================================================= */
        #minimap-crest-badge {
            position: absolute;
            right: 12px;
            bottom: 355px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.95) 0%, rgba(18, 24, 40, 0.9) 100%);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--gold-main);
            border-radius: 12px;
            padding: 6px 14px 6px 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.9), 0 0 15px rgba(212, 175, 55, 0.2);
            z-index: 100;
            transition: all 0.3s ease;
        }

        #minimap-crest-badge::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 20px;
            width: 10px;
            height: 10px;
            background: inherit;
            border-right: 1.5px solid var(--gold-main);
            border-bottom: 1.5px solid var(--gold-main);
            transform: rotate(45deg);
        }

        .minimap-logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.8));
        }

        .minimap-crest-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .minimap-crest-brand {
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 20%, var(--gold-bright) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
        }

        .minimap-crest-sub {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cyan-bright);
            text-shadow: 0 0 6px var(--cyan-glow);
        }

        /* =========================================================================
           3. MINIMAP BOTTOM INFO (Bottom Right Corner Under Map)
           ========================================================================= */
        #minimap-bottom-info {
            position: absolute;
            right: 14px;
            bottom: 8px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            z-index: 100;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .minimap-map-title {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: capitalize;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 1), 0 0 10px rgba(0, 0, 0, 0.9), 0 0 16px rgba(0, 0, 0, 0.9);
            line-height: 1.15;
        }

        .minimap-qualifier-line {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--cyan-bright);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 1), 0 0 8px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 210, 255, 0.4);
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* Theme Variants */
        body.theme-cyan {
            --border-glass: rgba(0, 210, 255, 0.45);
        }
        body.theme-cyan .top-tournament-title {
            background: linear-gradient(180deg, #ffffff 0%, #bae6fd 40%, #38bdf8 80%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body.theme-gold {
            --border-glass: rgba(212, 175, 55, 0.5);
        }
        body.theme-gold .top-tournament-title {
            background: linear-gradient(180deg, #ffffff 0%, #fff176 30%, #ffa726 65%, #ff5722 95%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hidden-element {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- 1. TOP BRAND BANNER -->
    <div id="top-brand-banner">
        <img src="/aoeitalia-logo.png" alt="AoE Italia Logo" class="top-logo-img" id="top-logo">
        <div class="top-divider"></div>
        <div class="top-titles-group">
            <div class="top-tournament-title" id="top-title-text">Ends of Summer Champions</div>
            <div class="top-sub-badge" id="top-sub-text">QUALIFICAZIONI SVIZZERA</div>
        </div>
        <div class="top-format-pill" id="top-format-badge">BO1</div>
    </div>

    <!-- 2. MINIMAP CREST BADGE -->
    <div id="minimap-crest-badge">
        <img src="/aoeitalia-logo.png" alt="AoE Italia" class="minimap-logo-img">
        <div class="minimap-crest-text">
            <div class="minimap-crest-brand" id="minimap-brand-title">AOE ITALIA</div>
            <div class="minimap-crest-sub" id="minimap-brand-sub">MASTERS</div>
        </div>
    </div>

    <!-- 3. MINIMAP BOTTOM INFO -->
    <div id="minimap-bottom-info">
        <div class="minimap-map-title" id="minimap-map-name">Dry Arabia</div>
        <div class="minimap-qualifier-line" id="minimap-day-text">Qualificazioni • Giornata 1/4</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "in-game-brand";

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        // Check preview param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('preview') === 'true' || urlParams.get('bg') === 'true') {
            document.body.classList.add('with-reference-bg');
        }

        function formatTitle(raw) {
            if (!raw) return 'Ends of Summer Champions';
            const lowerWords = ['of', 'dei', 'del', 'della', 'degli', 'delle', 'di', 'da', 'in', 'and', 'the', 'e', 'a', 'su', 'per', 'con', 'tra', 'fra'];
            return raw.trim().split(/\s+/).map((word, index) => {
                const wLower = word.toLowerCase();
                if (index > 0 && lowerWords.includes(wLower)) {
                    return wLower;
                }
                if (word === word.toUpperCase() && word.length > 2) {
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
                return word.charAt(0).toUpperCase() + word.slice(1);
            }).join(' ');
        }

        function render(state, displayName) {
            const s = state || {};

            // 1. Theme
            document.body.className = '';
            if (urlParams.get('preview') === 'true' || urlParams.get('bg') === 'true') {
                document.body.classList.add('with-reference-bg');
            }
            if (s.theme) {
                document.body.classList.add(	heme-);
            }

            // 2. Titles & Day
            const title = displayName || s.tournamentTitle || s.titleText || 'Ends of Summer Champions';
            const formattedTitle = formatTitle(title);
            const stageSub = s.stageSubtitle || s.subFormat || 'QUALIFICAZIONI SVIZZERA';
            const formatBadge = s.matchFormat || 'BO1';
            const mapName = s.mapName || 'Dry Arabia';
            
            const dayNum = s.dayNumber || 1;
            const dayText = s.dayText || Qualificazioni • Giornata /4;

            // Top Banner Elements
            const topBanner = document.getElementById('top-brand-banner');
            document.getElementById('top-title-text').innerText = formattedTitle;
            document.getElementById('top-sub-text').innerText = stageSub;
            document.getElementById('top-format-badge').innerText = formatBadge;

            // Minimap Badge Elements
            const minimapCrest = document.getElementById('minimap-crest-badge');
            document.getElementById('minimap-brand-title').innerText = s.minimapBrandTitle || 'AOE ITALIA';
            document.getElementById('minimap-brand-sub').innerText = s.minimapBrandSub || 'TOURNAMENT';

            // Minimap Bottom Info Elements
            const minimapBottom = document.getElementById('minimap-bottom-info');
            document.getElementById('minimap-map-name').innerText = mapName;
            document.getElementById('minimap-day-text').innerText = dayText;

            // Visibility Toggles
            if (s.showTopBanner === false) {
                topBanner.classList.add('hidden-element');
            } else {
                topBanner.classList.remove('hidden-element');
            }

            if (s.showMinimapCrest === false) {
                minimapCrest.classList.add('hidden-element');
            } else {
                minimapCrest.classList.remove('hidden-element');
            }

            if (s.showMinimapInfo === false) {
                minimapBottom.classList.add('hidden-element');
            } else {
                minimapBottom.classList.remove('hidden-element');
            }

            // Fine-tune offsets if configured
            if (s.topBannerOffsetY !== undefined) {
                topBanner.style.top = ${124 + Number(s.topBannerOffsetY)}px;
            }
            if (s.minimapCrestOffsetY !== undefined) {
                minimapCrest.style.bottom = ${355 + Number(s.minimapCrestOffsetY)}px;
            }
            if (s.minimapInfoOffsetY !== undefined) {
                minimapBottom.style.bottom = ${8 + Number(s.minimapInfoOffsetY)}px;
            }
        }

        async function init() {
            try {
                const { data, error } = await client
                    .from('stream_overlays')
                    .select('state, display_name')
                    .eq('id', OVERLAY_ID)
                    .single();

                if (!error && data) {
                    render(data.state, data.display_name);
                } else {
                    render({});
                }

                // Subscribe to realtime changes
                client
                    .channel(overlay-)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'stream_overlays',
                        filter: id=eq.
                    }, (payload) => {
                        const rec = payload.new;
                        if (rec) render(rec.state, rec.display_name);
                    })
                    .subscribe();

            } catch (err) {
                console.error("Errore init in-game-brand:", err);
                render({});
            }
        }

        init();
    </script>
</body>
</html>
