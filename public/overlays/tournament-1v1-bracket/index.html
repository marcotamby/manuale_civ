<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --gold-bright: #ffed4a; --red: #8b0000; --slate: #1e293b; --silver: #c0c0c0; }
        * { font-family: 'Inter', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 1920px; height: 1080px; color: white; overflow: hidden;
            background: transparent url('../background/background.png') no-repeat center center/cover;
        }

        /* Header - Current Match */
        #header { 
            position: absolute; top: 0; width: 100%; height: 140px; 
            display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.98), rgba(0,0,0,0.85)); 
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .player-box { width: 550px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .player-flag-bg {
            position: absolute; top: 0; bottom: 0; width: 45%;
            opacity: 0.55; background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: 1;
        }
        #p1-flag { left: 0; -webkit-mask-image: linear-gradient(to right, black 50%, transparent 100%); mask-image: linear-gradient(to right, black 50%, transparent 100%); }
        #p2-flag { right: 0; -webkit-mask-image: linear-gradient(to left, black 50%, transparent 100%); mask-image: linear-gradient(to left, black 50%, transparent 100%); }
        
        .player-content { position: relative; z-index: 3; text-align: center; }
        .player-name { font-size: 48px; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 15px rgba(0,0,0,0.9); }
        .player-civ { font-size: 20px; font-weight: 700; color: var(--gold); text-transform: uppercase; margin-top: -2px; letter-spacing: 2px; opacity: 0.9; }
        
        .score-box { 
            font-size: 64px; font-weight: 900; background: var(--red); 
            min-width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--gold); border-radius: 12px; margin: 0 30px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.6); z-index: 105;
        }

        .match-info { text-align: center; width: 300px; z-index: 105; }
        .map-name { font-size: 18px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        .vs-label { font-size: 12px; font-weight: 400; color: #888; text-transform: uppercase; letter-spacing: 8px; }

        /* TIMER - Electric Blue & Deep Navy */
        #timer-container { 
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); 
            display: none; flex-direction: column; align-items: center; gap: 10px; z-index: 100;
        }
        #timer-label {
            color: #00f2ff; font-size: 16px; font-weight: 950; text-transform: uppercase; letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.8);
        }
        #timer-display { 
            color: #fff; font-size: 56px; font-weight: 950; font-variant-numeric: tabular-nums;
            background: linear-gradient(180deg, #0a192f 0%, #000c1d 100%); 
            padding: 10px 50px; border-radius: 24px; border: 4px solid #00f2ff; 
            box-shadow: 0 0 45px rgba(0, 242, 255, 0.5), inset 0 0 25px rgba(0, 242, 255, 0.2);
            position: relative; overflow: hidden; letter-spacing: 2px;
        }

        /* BRACKET AREA */
        #bracket-container {
            position: absolute; top: 220px; left: 50%; transform: translateX(-50%);
            width: 1440px; height: 520px;
            display: flex; justify-content: space-between; align-items: stretch;
            padding: 45px 50px;
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(12px);
            border-radius: 40px; border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 35px 70px rgba(0,0,0,0.8);
        }

        .bracket-round { flex: 1; display: flex; flex-direction: column; justify-content: space-between; position: relative; align-items: center; padding-top: 10px; }
        
        .round-label { 
            position: absolute; top: -55px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #000; padding: 6px 24px; border-radius: 12px; 
            font-size: 13px; font-weight: 950; text-transform: uppercase; letter-spacing: 4px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7), 0 0 20px rgba(255, 255, 255, 0.4);
            border: 2px solid #fff; white-space: nowrap; z-index: 10;
        }

        .matchup {
            width: 290px; background: rgba(15, 23, 42, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px;
            overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            position: relative; transition: all 0.4s ease;
        }
        .matchup.active { border-color: var(--gold); box-shadow: 0 0 40px rgba(212, 175, 55, 0.4); transform: scale(1.04); }

        .bracket-player { 
            display: flex; align-items: center; background: rgba(13, 17, 26, 0.98); 
            height: 52px; width: 100%; position: relative; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s ease;
        }
        .bracket-player:last-child { border-bottom: none; }
        
        .bracket-civ-flag {
            position: absolute; inset: 0; background-size: cover; background-position: center;
            opacity: 1; z-index: 1; transition: all 0.5s ease;
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 95%);
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 45%, rgba(0,0,0,0) 95%);
        }

        .bracket-player .name { position: relative; z-index: 2; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 900; padding-left: 20px; color: #fff; font-size: 16px; }
        
        .bracket-player.winner { background: rgba(192, 192, 192, 0.4); border-color: rgba(192, 192, 192, 0.7); }
        .bracket-player.winner .name { color: #fff; text-shadow: 0 0 15px rgba(255, 255, 255, 0.5); }
        .bracket-player.winner::after { content: '🏆'; position: absolute; right: 16px; font-size: 18px; z-index: 3; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 1)); }
        
        .bracket-player.loser { opacity: 0.5; }
        .bracket-player.loser .bracket-civ-flag { opacity: 0.4; }

        .bracket-lines { position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }
        .bracket-line { stroke: rgba(255, 255, 255, 0.1); stroke-width: 3; fill: none; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .bracket-line.active { stroke: rgba(220, 220, 220, 0.95); stroke-width: 5; filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.5)); }

        /* CASTERS */
        #casters-container { position: absolute; bottom: 35px; width: 100%; display: flex; justify-content: space-between; padding: 0 65px; box-sizing: border-box; pointer-events: none; }
        .caster-box { display: flex; flex-direction: column; align-items: center; gap: 12px; visibility: hidden; opacity: 0; transform: translateY(25px); transition: all 0.7s ease; }
        .caster-box.active { visibility: visible; opacity: 1; transform: translateY(0); }
        .webcam-frame { width: 380px; height: 210px; border: 3px solid var(--gold); background: rgba(0,0,0,0.6); border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .caster-name { background: var(--gold); color: black; font-weight: 950; padding: 10px 35px; font-size: 22px; border-radius: 14px; text-transform: uppercase; min-width: 260px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.6); letter-spacing: 1.5px; }
    </style>
</head>
<body>
    <div id="header">
        <div id="p1-flag" class="player-flag-bg"></div>
        <div id="p2-flag" class="player-flag-bg"></div>
        <div class="player-box"><div class="player-content"><div id="p1-name" class="player-name">--</div></div></div>
        <div class="score-box" id="p1-score">0</div>
        <div class="match-info"><div id="current-map" class="map-name">MAPPA DA DEFINIRE</div><div class="vs-label">VS</div></div>
        <div class="score-box" id="p2-score">0</div>
        <div class="player-box"><div class="player-content"><div id="p2-name" class="player-name">--</div></div></div>
    </div>
    
    <div id="bracket-container">
        <svg id="bracket-svg" class="bracket-lines" viewBox="0 0 1440 520">
            <path id="line-q1" class="bracket-line" d="" />
            <path id="line-q2" class="bracket-line" d="" />
            <path id="line-q3" class="bracket-line" d="" />
            <path id="line-q4" class="bracket-line" d="" />
            <path id="line-s1" class="bracket-line" d="" />
            <path id="line-s2" class="bracket-line" d="" />
        </svg>

        <div class="bracket-round">
            <div class="round-label">Quarti di Finale</div>
            <div id="q1" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
            <div id="q2" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
            <div id="q3" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
            <div id="q4" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
        </div>
        <div class="bracket-round">
            <div class="round-label">Semifinali</div>
            <div id="s1" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
            <div id="s2" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
        </div>
        <div class="bracket-round">
            <div class="round-label">Gran Finale</div>
            <div id="f" class="matchup"><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div><div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div></div>
        </div>
    </div>

    <div id="casters-container">
        <div id="cb-1" class="caster-box"><div class="webcam-frame"></div><div id="c-1-name" class="caster-name"></div></div>
        <div id="cb-2" class="caster-box"><div class="webcam-frame"></div><div id="c-2-name" class="caster-name"></div></div>
    </div>

    <div id="timer-container">
        <div id="timer-label">Il game inizia tra...</div>
        <div id="timer-display">00:00</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "tournament-1v1-bracket";

        const CIV_DATA = {
            'abbasid': { name: 'Abbaside', flag: 'Abbasid Dynasty.webp' },
            'ayyubids': { name: 'Ayyubidi', flag: 'Ayyubids.webp' },
            'byzantines': { name: 'Bisantini', flag: 'Byzantines.webp' },
            'chinese': { name: 'Cinesi', flag: 'Chinese.webp' },
            'delhi': { name: 'Sultanato di Delhi', flag: 'Delhi Sultanate.webp' },
            'english': { name: 'Inglesi', flag: 'English.webp' },
            'french': { name: 'Francesi', flag: 'French.webp' },
            'goldenhorde': { name: 'Orda d\'Oro', flag: 'Golden Horde.webp' },
            'hre': { name: 'Sacro Romano Impero', flag: 'Holy Roman Empire.webp' },
            'japanese': { name: 'Giapponesi', flag: 'Japanese.webp' },
            'jeannedarc': { name: 'Jeanne d\'Arc', flag: 'jeannedarc.webp' },
            'lancaster': { name: 'Casato di Lancaster', flag: 'House of Lancaster.webp' },
            'malians': { name: 'Maliesi', flag: 'Malians.webp' },
            'mongols': { name: 'Mongoli', flag: 'Mongols.webp' },
            'orderofthedragon': { name: 'Ordine del Dragone', flag: 'Order of the Dragon.webp' },
            'ottomans': { name: 'Ottomani', flag: 'Ottomani.webp' },
            'rus': { name: 'Rus', flag: 'Rus.webp' },
            'templar': { name: 'Templari', flag: 'Knights Templar.webp' },
            'zhuxi': { name: 'Eredità di Zhu Xi', flag: 'Zhu Xis Legacy.webp' },
            'tughlaq': { name: 'Dinastia Tughlaq', flag: 'Tughlaq Dynasty.webp' },
            'sengoku': { name: 'Sengoku Daimyo', flag: 'Sengoku Daimyo.webp' },
            'macedonian': { name: 'Dinastia Macedone', flag: 'Macedonian Dynasty.webp' }
        };

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let lastState = null;
        let timerInterval = null;

        function getCivFlagUrl(id) {
            if (!id || typeof id !== 'string') return '';
            const data = CIV_DATA[id.toLowerCase()];
            return `/civs/${data ? data.flag : (id + '.webp')}`;
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return [m, s].map(v => v.toString().padStart(2, '0')).join(':');
        }

        function updateTimer() {
            const container = document.getElementById('timer-container');
            if (!lastState || !lastState.timer || !lastState.timer.active) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            const elapsed = Math.floor((Date.now() - (lastState.timer.timestamp || Date.now())) / 1000);
            const total = ((lastState.timer.min || 0) * 60) + (lastState.timer.sec || 0);
            let remaining = total - elapsed;
            if (remaining < 0) remaining = 0;
            document.getElementById('timer-display').innerText = formatTime(remaining);
        }

        function updateLines() {
            const container = document.getElementById('bracket-container');
            const svg = document.getElementById('bracket-svg');
            const containerRect = container.getBoundingClientRect();

            const matchups = {
                q1: { start: 'q1', end: 's1', idx: 0 },
                q2: { start: 'q2', end: 's1', idx: 1 },
                q3: { start: 'q3', end: 's2', idx: 0 },
                q4: { start: 'q4', end: 's2', idx: 1 },
                s1: { start: 's1', end: 'f', idx: 0 },
                s2: { start: 's2', end: 'f', idx: 1 }
            };

            Object.entries(matchups).forEach(([mid, config]) => {
                const startEl = document.getElementById(config.start);
                const endEl = document.getElementById(config.end);
                const path = document.getElementById(`line-${mid}`);

                if (startEl && endEl && path) {
                    const sRect = startEl.getBoundingClientRect();
                    const eRect = endEl.getBoundingClientRect();

                    // Relative to container
                    const xStart = sRect.right - containerRect.left;
                    const yStart = (sRect.top + sRect.height/2) - containerRect.top;
                    
                    const xEnd = eRect.left - containerRect.left;
                    const yTarget = (eRect.top + eRect.height/2) - containerRect.top;
                    
                    // Final Y depends on which slot (top or bottom) of the next match
                    const playerH = 52;
                    const yEnd = yTarget + (config.idx === 0 ? -playerH/2 : playerH/2);

                    const xm = xStart + (xEnd - xStart) / 2;
                    
                    const d = `M ${xStart},${yStart} L ${xm},${yStart} L ${xm},${yEnd} L ${xEnd},${yEnd}`;
                    path.setAttribute('d', d);
                }
            });
        }

        function render(state) {
            if (!state) return;
            lastState = state;

            try {
                document.getElementById('p1-name').innerText = state.p1?.name || '--';
                document.getElementById('p1-score').innerText = state.p1?.score ?? 0;
                document.getElementById('p1-flag').style.backgroundImage = state.p1?.civId ? `url('${getCivFlagUrl(state.p1.civId)}')` : 'none';
                
                document.getElementById('p2-name').innerText = state.p2?.name || '--';
                document.getElementById('p2-score').innerText = state.p2?.score ?? 0;
                document.getElementById('p2-flag').style.backgroundImage = state.p2?.civId ? `url('${getCivFlagUrl(state.p2.civId)}')` : 'none';
                
                document.getElementById('current-map').innerText = state.map || 'MAPPA DA DEFINIRE';
            } catch (e) {}

            try {
                const b = state.bracket || {};
                const rounds = ['q1', 'q2', 'q3', 'q4', 's1', 's2', 'f'];
                rounds.forEach(rid => {
                    const m = b[rid] || { p1: '', p2: '', w: 0 };
                    const el = document.getElementById(rid);
                    if (el) {
                        const players = el.querySelectorAll('.bracket-player');
                        const winner = parseInt(m.w || 0);
                        
                        [0, 1].forEach(idx => {
                            if (players[idx]) {
                                players[idx].querySelector('.name').innerText = (idx === 0 ? m.p1 : m.p2) || '--';
                                const flag = players[idx].querySelector('.bracket-civ-flag');
                                const civId = idx === 0 ? m.p1Civ : m.p2Civ;
                                if (flag) flag.style.backgroundImage = civId ? `url('${getCivFlagUrl(civId)}')` : 'none';
                                
                                players[idx].classList.remove('winner', 'loser');
                                if (winner > 0) {
                                    if (winner === (idx + 1)) players[idx].classList.add('winner');
                                    else players[idx].classList.add('loser');
                                }
                            }
                        });

                        const line = document.getElementById(`line-${rid}`);
                        if (line) line.classList.toggle('active', winner > 0);
                    }
                });
                
                // Trigger line update AFTER DOM changes
                setTimeout(updateLines, 50);
            } catch (e) { console.error(e); }

            try {
                (state.casters || []).forEach((c, i) => {
                    const box = document.getElementById(`cb-${i+1}`);
                    if (box) {
                        box.classList.toggle('active', c.active);
                        if (c.active) document.getElementById(`c-${i+1}-name`).innerText = c.name || '';
                    }
                });
            } catch (e) {}
            updateTimer();
        }

        async function init() {
            const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
            if (data?.state) render(data.state);

            client.channel('public:stream_overlays')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: `id=eq.${OVERLAY_ID}` }, payload => render(payload.new.state))
                .subscribe();

            setInterval(async () => {
                const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
                if (data?.state) render(data.state);
            }, 5000);

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
            
            window.addEventListener('resize', updateLines);
        }
        init();
    </script>
</body>
</html>
