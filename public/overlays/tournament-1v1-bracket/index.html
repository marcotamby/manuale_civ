<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --gold-bright: #ffed4a; --red: #8b0000; --slate: #1e293b; }
        * { font-family: 'Inter', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 1920px; height: 1080px; color: white; overflow: hidden;
            background: transparent url('../background/background.png') no-repeat center center/cover;
            margin: 0; padding: 0;
        }

        /* Header - Current Match */
        #header { 
            position: absolute; top: 0; width: 100%; height: 130px; 
            display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.98), rgba(0,0,0,0.85)); 
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            z-index: 100;
        }
        .player-box { width: 550px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        .player-flag-bg {
            position: absolute; top: 0; bottom: 0; width: 45%;
            opacity: 0.55; background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: 1;
        }
        #p1-flag {
            left: 0;
            -webkit-mask-image: linear-gradient(to right, black 50%, transparent 100%);
            mask-image: linear-gradient(to right, black 50%, transparent 100%);
        }
        #p2-flag {
            right: 0;
            -webkit-mask-image: linear-gradient(to left, black 50%, transparent 100%);
            mask-image: linear-gradient(to left, black 50%, transparent 100%);
        }
        .player-content { position: relative; z-index: 3; text-align: center; }
        .player-name { font-size: 48px; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 15px rgba(0,0,0,0.9); }
        .player-civ { font-size: 20px; font-weight: 700; color: var(--gold); text-transform: uppercase; margin-top: -2px; letter-spacing: 2px; opacity: 0.9; }
        
        .score-box { 
            font-size: 64px; font-weight: 900; background: var(--red); 
            min-width: 100px; height: 100px; display: flex; align-items: center; justify-content: center;
            line-height: 1;
            border: 2px solid var(--gold); border-radius: 12px; margin: 0 30px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.6);
            z-index: 105;
        }

        /* Center Info */
        .match-info { text-align: center; width: 300px; z-index: 105; }
        .map-name { font-size: 18px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 5px; }
        .vs-label { font-size: 12px; font-weight: 400; color: #888; text-transform: uppercase; letter-spacing: 8px; }

        /* BRACKET AREA */
        #bracket-container {
            position: absolute; top: 175px; left: 50%; transform: translateX(-50%);
            width: 1380px; height: 480px;
            display: flex; justify-content: space-between; align-items: stretch;
            padding: 35px 40px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(3px);
            border-radius: 35px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .bracket-round { flex: 1; display: flex; flex-direction: column; justify-content: space-around; position: relative; align-items: center; }
        .matchup {
            width: 270px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 14px;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            position: relative; transition: all 0.3s ease;
        }
        .matchup.active { border-color: var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); transform: scale(1.02); }

        .bracket-player {
            height: 48px; display: flex; align-items: center; padding: 0 18px;
            font-size: 15px; font-weight: 700; color: #cbd5e1;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: relative; overflow: hidden; transition: all 0.4s ease;
        }
        .bracket-player:last-child { border-bottom: none; }
        
        .bracket-civ-flag {
            position: absolute; inset: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0.35; z-index: 1; transition: all 0.4s ease;
            -webkit-mask-image: linear-gradient(to right, black 30%, transparent 95%);
            mask-image: linear-gradient(to right, black 30%, transparent 95%);
        }

        .bracket-player .name { position: relative; z-index: 2; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; }
        
        .bracket-player.winner { color: #fff; background: rgba(212, 175, 55, 0.3); text-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        .bracket-player.winner::after { content: '🏆'; position: absolute; right: 12px; font-size: 14px; z-index: 3; }
        .bracket-player.winner .bracket-civ-flag { opacity: 0.6; }
        
        .bracket-player.loser { opacity: 0.2; filter: grayscale(1); }
        .bracket-player.loser .bracket-civ-flag { opacity: 0.05; }

        /* BRACKET LINES */
        .bracket-lines {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            width: 100%; height: 100%;
        }
        .bracket-line { stroke: rgba(212, 175, 55, 0.2); stroke-width: 2; fill: none; }

        /* CASTERS */
        #casters-container { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-between; padding: 0 50px; box-sizing: border-box; pointer-events: none; }
        .caster-box { display: flex; flex-direction: column; align-items: center; gap: 8px; visibility: hidden; transform: scale(0.85); transform-origin: bottom; }
        .caster-box.active { visibility: visible; }
        .webcam-frame { width: 340px; height: 190px; border: 2px solid var(--gold); background: rgba(0,0,0,0.4); border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .caster-name { background: var(--gold); color: black; font-weight: 900; padding: 6px 25px; font-size: 18px; border-radius: 10px; text-transform: uppercase; min-width: 220px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }

        /* TIMER */
        #timer-container {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.92); border: 2px solid var(--gold); border-radius: 15px;
            padding: 8px 45px; display: none; align-items: center; justify-content: center;
            min-width: 220px; box-shadow: 0 0 50px rgba(0,0,0,0.9); z-index: 10;
        }
        #timer-display { font-size: 44px; font-weight: 900; color: var(--gold); letter-spacing: 3px; font-variant-numeric: tabular-nums; }

        .round-label {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%);
            font-size: 11px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 3px;
            background: rgba(0,0,0,0.8); padding: 5px 14px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="header">
        <div id="p1-flag" class="player-flag-bg"></div>
        <div id="p2-flag" class="player-flag-bg"></div>

        <div class="player-box">
            <div class="player-content">
                <div id="p1-name" class="player-name">--</div>
            </div>
        </div>
        <div class="score-box" id="p1-score">0</div>
        <div class="match-info">
            <div id="current-map" class="map-name">MAPPA DA DEFINIRE</div>
            <div class="vs-label">VS</div>
        </div>
        <div class="score-box" id="p2-score">0</div>
        <div class="player-box">
            <div class="player-content">
                <div id="p2-name" class="player-name">--</div>
            </div>
        </div>
    </div>
    
    <div id="bracket-container">
        <!-- Lines Layer -->
        <svg class="bracket-lines" viewBox="0 0 1400 600">
            <!-- Q1/Q2 to S1 -->
            <path class="bracket-line" d="M 355,75 L 460,75 L 460,125 L 565,125" />
            <path class="bracket-line" d="M 355,225 L 460,225 L 460,175 L 565,175" />
            <!-- Q3/Q4 to S2 -->
            <path class="bracket-line" d="M 355,375 L 460,375 L 460,425 L 565,425" />
            <path class="bracket-line" d="M 355,525 L 460,525 L 460,475 L 565,475" />
            <!-- S1/S2 to F -->
            <path class="bracket-line" d="M 835,150 L 940,150 L 940,275 L 1045,275" />
            <path class="bracket-line" d="M 835,450 L 940,450 L 940,325 L 1045,325" />
        </svg>

        <!-- Quarter Finals -->
        <div class="bracket-round">
            <div class="round-label">Quarti di Finale</div>
            <div id="q1" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
            <div id="q2" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
            <div id="q3" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
            <div id="q4" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
        </div>

        <!-- Semi Finals -->
        <div class="bracket-round">
            <div class="round-label">Semifinali</div>
            <div id="s1" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
            <div id="s2" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
        </div>

        <!-- Grand Final -->
        <div class="bracket-round">
            <div class="round-label">Gran Finale</div>
            <div id="f" class="matchup">
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
                <div class="bracket-player"><div class="bracket-civ-flag"></div><span class="name">--</span></div>
            </div>
        </div>
    </div>

    <div id="casters-container">
        <div id="cb-1" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-1-name" class="caster-name"></div>
        </div>
        <div id="cb-2" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-2-name" class="caster-name"></div>
        </div>
    </div>

    <div id="timer-container">
        <div id="timer-display">00:00</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        const OVERLAY_ID = "tournament-1v1-bracket";

        const CIV_DATA = {
            'abbasid': { name: 'Abbaside', flag: 'Abbasid Dynasty.webp' },
            'ayyubids': { name: 'Ayyubidi', flag: 'Ayyubids.webp' },
            'byzantines': { name: 'Bisantini', flag: 'Byzantines.webp' },
            'chinese': { name: 'Cinesi', flag: 'Chinese.webp' },
            'delhi': { name: 'Sultanato di Delhi', flag: 'Delhi Sultanate.webp' },
            'english': { name: 'Inglesi', flag: 'English.webp' },
            'french': { name: 'Francesi', flag: 'French.webp' },
            'goldenhorde': { name: 'Orda d\'Oro', flag: 'Golden Horde.webp' },
            'hre': { name: 'Sacro Romano Impero', flag: 'Holy Roman Empire.webp' },
            'japanese': { name: 'Giapponesi', flag: 'Japanese.webp' },
            'jeannedarc': { name: 'Jeanne d\'Arc', flag: 'jeannedarc.webp' },
            'lancaster': { name: 'Casato di Lancaster', flag: 'House of Lancaster.webp' },
            'malians': { name: 'Maliesi', flag: 'Malians.webp' },
            'mongols': { name: 'Mongoli', flag: 'Mongols.webp' },
            'orderofthedragon': { name: 'Ordine del Dragone', flag: 'Order of the Dragon.webp' },
            'ottomans': { name: 'Ottomani', flag: 'Ottomans.webp' },
            'rus': { name: 'Rus', flag: 'Rus.webp' },
            'templar': { name: 'Templari', flag: 'Knights Templar.webp' },
            'zhuxi': { name: 'Eredità di Zhu Xi', flag: 'Zhu Xis Legacy.webp' },
            'tughlaq': { name: 'Dinastia Tughlaq', flag: 'Tughlaq Dynasty.webp' },
            'sengoku': { name: 'Sengoku Daimyo', flag: 'Sengoku Daimyo.webp' },
            'macedonian': { name: 'Dinastia Macedone', flag: 'Macedonian Dynasty.webp' }
        };

        function getCivFlagUrl(id) {
            if (!id || typeof id !== 'string') return '';
            const data = CIV_DATA[id.toLowerCase()];
            const filename = data ? data.flag : (id + '.webp');
            return `/civs/${filename}`;
        }

        function getCivName(id) {
            if (!id || typeof id !== 'string') return '--';
            const data = CIV_DATA[id.toLowerCase()];
            return data ? data.name : id;
        }
        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let lastState = null;
        let timerInterval = null;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return [m, s].map(v => v.toString().padStart(2, '0')).join(':');
        }

        function updateTimer() {
            if (!lastState || !lastState.timer || !lastState.timer.active) {
                document.getElementById('timer-container').style.display = 'none';
                return;
            }
            document.getElementById('timer-container').style.display = 'flex';
            const startTimestamp = lastState.timer.timestamp || Date.now();
            const configSeconds = ((lastState.timer.min || 0) * 60) + (lastState.timer.sec || 0);
            const elapsed = Math.floor((Date.now() - startTimestamp) / 1000);
            let totalSeconds = configSeconds - elapsed;
            if (totalSeconds < 0) totalSeconds = 0;
            document.getElementById('timer-display').innerText = formatTime(totalSeconds);
        }

        function render(state) {
            if (!state) return;
            lastState = state;

            // Current Match - Player 1
            try {
                document.getElementById('p1-name').innerText = state.p1?.name || '--';
                document.getElementById('p1-score').innerText = state.p1?.score ?? 0;
                const p1Flag = document.getElementById('p1-flag');
                if (p1Flag) p1Flag.style.backgroundImage = state.p1?.civId ? `url('${getCivFlagUrl(state.p1.civId)}')` : 'none';
            } catch (e) { console.error("Error rendering P1:", e); }

            // Current Match - Player 2
            try {
                document.getElementById('p2-name').innerText = state.p2?.name || '--';
                document.getElementById('p2-score').innerText = state.p2?.score ?? 0;
                const p2Flag = document.getElementById('p2-flag');
                if (p2Flag) p2Flag.style.backgroundImage = state.p2?.civId ? `url('${getCivFlagUrl(state.p2.civId)}')` : 'none';
            } catch (e) { console.error("Error rendering P2:", e); }

            try {
                document.getElementById('current-map').innerText = state.map || 'MAPPA DA DEFINIRE';
            } catch (e) {}

            // Bracket
            try {
                const b = state.bracket || {};
                const rounds = ['q1', 'q2', 'q3', 'q4', 's1', 's2', 'f'];
                rounds.forEach(rid => {
                    const m = b[rid] || { p1: '', p2: '', w: 0 };
                    const el = document.getElementById(rid);
                    if (el) {
                        const players = el.querySelectorAll('.bracket-player');
                        
                        // Player 1
                        if (players[0]) {
                            players[0].querySelector('.name').innerText = m.p1 || '--';
                            const flag = players[0].querySelector('.bracket-civ-flag');
                            if (flag) flag.style.backgroundImage = m.p1Civ ? `url('${getCivFlagUrl(m.p1Civ)}')` : 'none';
                            
                            players[0].classList.remove('winner', 'loser');
                            if (m.w === 1) players[0].classList.add('winner');
                            if (m.w === 2) players[0].classList.add('loser');
                        }

                        // Player 2
                        if (players[1]) {
                            players[1].querySelector('.name').innerText = m.p2 || '--';
                            const flag = players[1].querySelector('.bracket-civ-flag');
                            if (flag) {
                                flag.style.backgroundImage = m.p2Civ ? `url('${getCivFlagUrl(m.p2Civ)}')` : 'none';
                                flag.style.opacity = m.p2Civ ? '1' : '0';
                            }

                            players[1].classList.remove('winner', 'loser');
                            if (m.w === 2) players[1].classList.add('winner');
                            if (m.w === 1) players[1].classList.add('loser');
                        }
                    }
                });
            } catch (e) { console.error("Error rendering bracket:", e); }

            // Casters
            try {
                (state.casters || []).forEach((c, i) => {
                    const box = document.getElementById(`cb-${i+1}`);
                    const name = document.getElementById(`c-${i+1}-name`);
                    if (box && name) {
                        if (c.active) {
                            name.innerText = c.name || '';
                            box.classList.add('active');
                        } else {
                            box.classList.remove('active');
                        }
                    }
                });
            } catch (e) { console.error("Error rendering casters:", e); }

            updateTimer();
        }

        async function init() {
            const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
            if (data?.state) render(data.state);

            client.channel('public:stream_overlays')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: `id=eq.${OVERLAY_ID}` }, payload => render(payload.new.state))
                .subscribe();

            // Fallback polling every 5 seconds to ensure sync even if real-time fails
            setInterval(async () => {
                const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
                if (data?.state) render(data.state);
            }, 5000);

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        init();
    </script>
</body>
</html>
