<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --gold-bright: #ffed4a; --red: #8b0000; --blue: #0044ff; --silver: #c0c0c0; }
        * { font-family: 'Outfit', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 1920px; height: 1080px; color: white; overflow: hidden;
            background: url('../tournament-bg.png') center/cover no-repeat transparent;
        }

        #header { 
            position: absolute; top: 0; width: 100%; height: 100px; 
            display: flex; justify-content: center; align-items: center; 
            background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0.8)); 
            border-bottom: 2px solid var(--gold);
            z-index: 100;
        }
        #bracket-title { font-size: 38px; font-weight: 950; text-transform: uppercase; letter-spacing: 8px; color: #fff; }

        #bracket-container {
            position: absolute; top: 170px; left: 50%; transform: translateX(-50%) scale(0.86); transform-origin: top center;
            width: 1840px; height: 920px;
            display: flex; justify-content: space-between; align-items: stretch;
            padding: 30px 10px;
            background: rgba(10, 15, 28, 0.55);
            backdrop-filter: blur(12px);
            border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #phases-wrapper {
            display: flex; width: 100%; height: 100%; justify-content: space-between;
        }

        .phase-column {
            display: flex; flex-direction: column; justify-content: space-around;
            flex: 1; gap: 15px; padding: 0 15px; position: relative; z-index: 5;
        }

        .phase-label { 
            position: absolute; top: -80px; left: 50%; transform: translateX(-50%); 
            background: linear-gradient(135deg, #ffffff 0%, #b0b0b0 100%); 
            color: #000; padding: 8px 30px; border-radius: 12px; 
            font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.5); border: 1px solid #fff;
            white-space: nowrap; z-index: 10;
        }

        .match-card { 
            background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            transition: all 0.5s ease; width: 100%; position: relative;
            display: flex; flex-direction: column; gap: 2px;
        }

        .caster-box {
            display: flex; flex-direction: column; align-items: stretch;
            width: 260px;
            align-self: flex-end;
            position: relative; z-index: 10;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
        }
        .caster-cam {
            height: 146px;
            border: 2px solid #2563eb;
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            background: transparent; 
            box-shadow: inset 0 0 20px rgba(37, 99, 235, 0.3), 0 0 15px rgba(37, 99, 235, 0.4);
        }
        .caster-name-bar {
            background: linear-gradient(135deg, rgba(20, 30, 50, 0.95) 0%, rgba(10, 15, 28, 0.95) 100%);
            border: 2px solid #2563eb;
            border-radius: 0 0 12px 12px;
            padding: 8px 10px;
            text-align: center;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }
        .caster-name { font-size: 16px; font-weight: 950; color: white; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 5px rgba(0,0,0,1); }
        
        .team-row {  
            display: flex; align-items: center; padding: 10px 16px; height: 68px; 
            position: relative; overflow: hidden;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
        }
        .team-row.winner { background: rgba(255, 255, 255, 0.08); }
        .team-row.winner .team-score-box { background: rgba(255, 215, 0, 0.2); border-color: var(--gold); }
        .team-row.winner .team-score-box::after { content: '🏆'; position: absolute; right: 10px; font-size: 16px; filter: drop-shadow(0 0 10px var(--gold)); z-index: 25; }
        
        .bye-badge { background: #fff; color: #000; font-size: 10px; font-weight: 950; padding: 2px 8px; border-radius: 4px; margin-left: 10px; vertical-align: middle; position: relative; z-index: 20; box-shadow: 0 0 10px rgba(255,255,255,0.5); }
        
        .bracket-civ-flag { 
            position: absolute; top: 0; bottom: 0;
            background-size: cover; background-position: center; 
            image-rendering: -webkit-optimize-contrast;
            opacity: 1; z-index: 1; pointer-events: none;
        }

        .team-info { flex: 1; display: flex; flex-direction: column; position: relative; z-index: 15; min-width: 0; }
        .team-name { font-size: 20px; font-weight: 950; color: white; text-transform: uppercase; letter-spacing: -0.5px; display: flex; align-items: center; text-shadow: 0 2px 5px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .team-players { font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 1); text-transform: uppercase; letter-spacing: 1px; margin-top: -2px; text-shadow: 0 2px 5px rgba(0,0,0,1), 0 0 10px rgba(0,0,0,1), 0 0 20px rgba(0,0,0,1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .team-civs-container {
            position: absolute;
            top: 0; bottom: 0;
            right: 76px; /* Touch the left edge of the score box */
            left: 0; /* Touch the left edge */
            display: flex; 
            flex-direction: row-reverse; 
            align-items: stretch;
            gap: 0; 
            z-index: 5;
            opacity: 1;
        }
        .civ-flag-mini {
            flex: 1;
            height: 100%;
            background-size: cover; 
            background-position: center; 
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
            filter: brightness(1.1) contrast(1.1);
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 10%, rgba(0,0,0,1) 90%, rgba(0,0,0,0) 100%);
        }

        .team-score-box {
            position: relative; z-index: 20;
            background: rgba(255, 255, 255, 0.45);
            color: white; font-weight: 950; font-size: 24px;
            width: 76px; height: 44px;
            display: flex; align-items: center; justify-content: flex-start;
            padding-left: 20px;
            border-radius: 8px 0 0 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-right: none;
            box-shadow: -4px 0 15px rgba(0,0,0,0.4);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            flex-shrink: 0;
            margin-right: -16px; /* Coincide with the end of the team box */
        }

        .bracket-svg { position: absolute; inset: 0; pointer-events: none; z-index: 0; width: 100%; height: 100%; }
        .bracket-line { stroke: rgba(255, 255, 255, 0.25); stroke-width: 2; fill: none; }
        .bracket-line.active { stroke: rgba(255, 255, 255, 0.85); stroke-width: 3.5; filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.4)); }

    </style>
</head>
<body>
    <div id="header">
        <div id="bracket-title">TABELLONE TORNEO 2V2</div>
    </div>
    
    <div id="bracket-container">
        <svg id="bracket-svg" class="bracket-svg"></svg>
        <div id="phases-wrapper"></div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        
        let OVERLAY_ID = window.location.pathname.split('/').filter(p => p && p !== 'index.html').pop();
        if (!OVERLAY_ID || OVERLAY_ID === 'overlays') {
            const params = new URLSearchParams(window.location.search);
            OVERLAY_ID = params.get('id') || "tournament-2v2-low-bracket";
        }

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);

        function getCivFlagUrl(id) {
            if (!id) return '';
            const mapping = {
                'abbasid': 'Abbasid Dynasty',
                'ayyubids': 'Ayyubids',
                'byzantines': 'Byzantines',
                'chinese': 'Chinese',
                'delhi': 'Delhi Sultanate',
                'english': 'English',
                'french': 'French',
                'hre': 'Holy Roman Empire',
                'japanese': 'Japanese',
                'jeannedarc': 'jeannedarc',
                'malians': 'Malians',
                'mongols': 'Mongols',
                'orderofthedragon': 'Order of the Dragon',
                'ottomans': 'Ottomans',
                'rus': 'Rus',
                'zhuxi': 'Zhu Xis Legacy',
                'goldenhorde': 'Golden Horde',
                'lancaster': 'House of Lancaster',
                'macedonian': 'Macedonian Dynasty',
                'sengoku': 'Sengoku Daimyo',
                'templar': 'Knights Templar',
                'tughlaq': 'Tughlaq Dynasty'
            };
            const name = mapping[id.toLowerCase()] || id;
            return `/civs/${name}.webp`;
        }

        function updateLines(state) {
            const svg = document.getElementById('bracket-svg');
            const container = document.getElementById('bracket-container');
            const containerRect = container.getBoundingClientRect();
            const scale = 0.86; // Current CSS scale
            svg.innerHTML = '';

            const phases = state.bracket.phases || [];
            phases.forEach((phase, pIdx) => {
                if (pIdx >= phases.length - 1) return;
                
                phase.matches.forEach((match, mIdx) => {
                    const startMatchEl = document.getElementById(`match-${pIdx}-${mIdx}`);
                    const nextMatchIdx = Math.floor(mIdx / 2);
                    const endMatchEl = document.getElementById(`match-${pIdx + 1}-${nextMatchIdx}`);
                    
                    if (startMatchEl && endMatchEl) {
                        const sRect = startMatchEl.getBoundingClientRect();
                        const eRect = endMatchEl.getBoundingClientRect();
                        
                        const xStart = (sRect.right - containerRect.left) / scale;
                        const yStart = ((sRect.top + sRect.height / 2) - containerRect.top) / scale;
                        
                        const xEnd = (eRect.left - containerRect.left) / scale;
                        const yBase = ((eRect.top + eRect.height / 2) - containerRect.top) / scale;
                        
                        const slot = mIdx % 2 === 0 ? 0 : 1;
                        const yEnd = yBase + (slot === 0 ? -36 : 36);
                        const xMid = xStart + (xEnd - xStart) * 0.5;
                        
                        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                        path.setAttribute('class', `bracket-line ${match.w > 0 ? 'active' : ''}`);
                        const d = `M ${xStart},${yStart} L ${xMid},${yStart} L ${xMid},${yEnd} L ${xEnd},${yEnd}`;
                        path.setAttribute('d', d);
                        svg.appendChild(path);
                    }
                });
            });
        }

        function render(state) {
            if (!state || !state.bracket) return;
            const b = state.bracket;
            document.getElementById('bracket-title').innerText = b.title || 'TABELLONE TORNEO 2V2';

            const wrapper = document.getElementById('phases-wrapper');
            wrapper.innerHTML = '';

            (b.phases || []).forEach((phase, pIdx) => {
                const column = document.createElement('div');
                column.className = 'phase-column';

                const label = document.createElement('div');
                label.className = 'phase-label';
                label.innerText = phase.name;
                column.appendChild(label);

                const isFinale = pIdx === (b.phases.length - 1);
                let caster1Html = '';
                let caster2Html = '';

                if (isFinale && state.casters && state.casters.length > 0) {
                    if (state.casters[0] && state.casters[0].active) {
                        caster1Html = `
                            <div class="caster-box">
                                <div class="caster-cam"></div>
                                <div class="caster-name-bar"><span class="caster-name">${state.casters[0].name || 'Caster 1'}</span></div>
                            </div>`;
                    }
                    if (state.casters[1] && state.casters[1].active) {
                        caster2Html = `
                            <div class="caster-box">
                                <div class="caster-cam"></div>
                                <div class="caster-name-bar"><span class="caster-name">${state.casters[1].name || 'Caster 2'}</span></div>
                            </div>`;
                    }
                }

                if (caster1Html) {
                    const temp = document.createElement('div');
                    temp.innerHTML = caster1Html;
                    column.appendChild(temp.firstElementChild);
                }

                (phase.matches || []).forEach((match, mIdx) => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.id = `match-${pIdx}-${mIdx}`;
                                      const renderTeam = (teamName, players, civs, isWinner, hasBye, isT1) => {
                        const playerDisplay = (players || []).filter(p => p && p.trim()).join(' & ');
                        const score = match[isT1 ? 't1Score' : 't2Score'];
                        
                        let civFlagsHtml = '';
                        if (civs && civs.length > 0) {
                            const sortedCivs = [...civs].reverse();
                            civFlagsHtml = '<div class="team-civs-container">';
                            sortedCivs.forEach((cId) => {
                                civFlagsHtml += `<div class="civ-flag-mini" style="background-image: url('${getCivFlagUrl(cId)}');"></div>`;
                            });
                            civFlagsHtml += '</div>';
                        }

                        return `
                            <div class="team-row ${isWinner ? 'winner' : ''}">
                                <div class="team-info">
                                    <div class="team-name">
                                        ${teamName || '--'}
                                        ${hasBye ? '<span class="bye-badge">BYE</span>' : ''}
                                    </div>
                                    <div class="team-players">${playerDisplay || '--'}</div>
                                </div>
                                ${civFlagsHtml}
                                <div class="team-score-box">${score || 0}</div>
                            </div>
                        `;
                    };

                    card.innerHTML = `
                        ${renderTeam(match.t1, match.t1Players, match.t1Civs, match.w === 1, match.t1Bye, true)}
                        ${renderTeam(match.t2, match.t2Players, match.t2Civs, match.w === 2, match.t2Bye, false)}
                    `;
                    column.appendChild(card);
                });

                if (caster2Html) {
                    const temp = document.createElement('div');
                    temp.innerHTML = caster2Html;
                    column.appendChild(temp.firstElementChild);
                }

                wrapper.appendChild(column);
            });

            setTimeout(() => updateLines(state), 300);
        }

        async function init() {
            const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
            if (data?.state) render(data.state);

            client.channel('public:stream_overlays')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: `id=eq.${OVERLAY_ID}` }, payload => render(payload.new.state))
                .subscribe();
            
            window.addEventListener('resize', async () => {
                const { data } = await client.from('stream_overlays').select('state').eq('id', OVERLAY_ID).single();
                if (data?.state) updateLines(data.state);
            });
        }
        init();
    </script>
</body>
</html>
