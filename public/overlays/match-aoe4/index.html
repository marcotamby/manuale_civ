<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #d4af37; --gold-bright: #ffed4a; --red: #8b0000; }
        * { font-family: 'Inter', sans-serif !important; margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            width: 1920px; height: 1080px; color: white; overflow: hidden;
            background: transparent url('../background/background.png') no-repeat center center/cover;
            margin: 0; padding: 0;
        }

        /* Header */
        #header { position: absolute; top: 0; width: 100%; height: 125px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); border-bottom: 2px solid var(--gold); }
        .team-box { width: 580px; text-align: center; }
        .team-name { font-size:36px; font-weight:900; color:var(--gold); text-transform:uppercase; letter-spacing: 1px; }
        .players-display { color: #ddd; font-size: 25px; font-weight: 400; margin-top: 2px; letter-spacing: 0.5px; }
        .score-box { font-size: 55px; font-weight: 900; background: var(--red); min-width: 85px; text-align: center; border: 2px solid var(--gold); border-radius: 8px; margin: 0 20px; padding: 2px 14px; }

        #maps-container { position: absolute; top: 255px; width: 100%; display: flex; justify-content: center; gap: 320px; }
        
        @keyframes master-pulse { 0% { transform: scale(1); } 100% { transform: scale(1.04); } }
        .map-wrapper { position: relative; width: 500px; height: 280px; }
        .map-wrapper.active { animation: master-pulse 2s infinite alternate ease-in-out; }

        .map-card { width: 100%; height: 100%; background: #000; position: relative; border: 2px solid var(--gold); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; z-index: 2; }
        .map-card img { width: 100%; height: 200px; object-fit: cover; }
        .map-name { height: 80px; text-align: center; line-height: 80px; font-weight: 700; color: var(--gold); text-transform: uppercase; font-size: 18px; background: #000; border-top: 1px solid var(--gold); }

        .label { 
            position: absolute; 
            top: -55px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: var(--gold-bright); 
            color: black; 
            padding: 6px 30px; 
            font-weight: 900; 
            border-radius: 4px; 
            z-index: 10; 
            text-transform: uppercase; 
            font-size: 18px; 
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            white-space: nowrap;
        }

        .civ-icons { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 20; }
        .civ-icons.left { left: -95px; } .civ-icons.right { right: -95px; }
        .civ-unit { width: 85px; height: 85px; position: relative; }
        .civ-dot { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--gold); background-size: cover; background-position: center; background-color: #000; }

        .crown { position: absolute; top: -55px; left: 50%; transform: translateX(-50%); font-size: 45px; z-index: 100; filter: drop-shadow(0 0 8px gold); }

        /* CASTERS */
        #casters-container { position: absolute; bottom: 80px; width: 100%; display: flex; justify-content: space-between; padding: 0 80px; box-sizing: border-box; pointer-events: none; }
        .caster-box { display: flex; flex-direction: column; align-items: center; gap: 10px; visibility: hidden; }
        .caster-box.active { visibility: visible; }
        .webcam-frame { width: 380px; height: 214px; border: 2px solid var(--gold); background: rgba(0,0,0,0.3); border-radius: 4px; }
        .caster-name { background: var(--gold); color: black; font-weight: 800; padding: 8px 30px; font-size: 22px; border-radius: 4px; text-transform: uppercase; min-width: 240px; text-align: center; }

        /* TIMER */
        #timer-container {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); border: 2px solid var(--gold); border-radius: 8px;
            padding: 10px 40px; display: none; align-items: center; justify-content: center;
            min-width: 200px; box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        #timer-display { font-size: 42px; font-weight: 900; color: var(--gold); letter-spacing: 2px; font-variant-numeric: tabular-nums; }

        #central-divider {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 4px; height: 100%; background: linear-gradient(to bottom, transparent, rgba(255,204,0,0.5), transparent);
            box-shadow: 0 0 15px rgba(255,204,0,0.3);
            display: none;
        }
    </style>
</head>
<body>
    <div id="central-divider"></div>
    <div id="header">
        <div class="team-box">
            <div id="t1-name" class="team-name">--</div>
            <div id="t1-players" class="players-display">--</div>
        </div>
        <div class="score-box" id="t1-score">0</div>
        <div class="score-box" id="t2-score">0</div>
        <div class="team-box">
            <div id="t2-name" class="team-name">--</div>
            <div id="t2-players" class="players-display">--</div>
        </div>
    </div>
    
    <div id="maps-container"></div>

    <div id="casters-container">
        <div id="cb-1" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-1-name" class="caster-name"></div>
        </div>
        <div id="cb-2" class="caster-box">
            <div class="webcam-frame"></div>
            <div id="c-2-name" class="caster-name"></div>
        </div>
    </div>

    <div id="timer-container">
        <div id="timer-display">00:00:00</div>
    </div>

    <script>
        const SUB_URL = "https://laliiuqjpxanhwhxajlm.supabase.co";
        const SUB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhbGlpdXFqcHhhbmh3aHhhamxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NjQ5MjEsImV4cCI6MjA4ODU0MDkyMX0.1xIE1MXy1JxgGzpP0Hitotz8o3aMwASV8NUr06bQjkA";
        
        const civMap = {
            'abbasid': 'Abbasid Dynasty.webp',
            'ayyubids': 'Ayyubids.webp',
            'byzantines': 'Byzantines.webp',
            'chinese': 'Chinese.webp',
            'delhi': 'Delhi Sultanate.webp',
            'english': 'English.webp',
            'french': 'French.webp',
            'goldenhorde': 'Golden Horde.webp',
            'hre': 'Holy Roman Empire.webp',
            'japanese': 'Japanese.webp',
            'jeannedarc': "Jeanne d'Arc.webp",
            'lancaster': "House of Lancaster.webp",
            'malians': 'Malians.webp',
            'mongols': 'Mongols.webp',
            'orderofthedragon': "Order of the Dragon.webp",
            'ottomans': 'Ottomans.webp',
            'rus': 'Rus.webp',
            'templar': "Knights Templar.webp",
            'zhuxi': "Zhu Xis Legacy.webp",
            'tughlaq': 'Tughlaq Dynasty.webp',
            'sengoku': 'Sengoku Daimyo.webp',
            'macedonian': 'Macedonian Dynasty.webp'
        };

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let lastState = null;
        let timerInterval = null;

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return [h, m, s].map(v => v.toString().padStart(2, '0')).join(':');
        }

        function updateTimer() {
            if (!lastState || !lastState.timer || !lastState.timer.active) {
                document.getElementById('timer-container').style.display = 'none';
                return;
            }

            document.getElementById('timer-container').style.display = 'flex';
            
            const startTimestamp = lastState.timer.timestamp || Date.now();
            const configSeconds = ((lastState.timer.min || 0) * 60) + (lastState.timer.sec || 0);
            const elapsed = Math.floor((Date.now() - startTimestamp) / 1000);
            
            // Countdown logic
            let totalSeconds = configSeconds - elapsed;
            if (totalSeconds < 0) totalSeconds = 0;
            
            document.getElementById('timer-display').innerText = formatTime(totalSeconds);
        }

        function getCivUrl(id) {
            if (!id) return '';
            const filename = civMap[id] || id + '.webp';
            return `/civs/${filename}`;
        }

        function getMapUrl(name) {
            if (!name) return '/maps/default.png';
            return `/maps/${name.replace(/ /g, '_')}.png`;
        }

        function render(state) {
            if (!state) return;
            lastState = state;
            console.log("Rendering state:", state);

            // Teams
            document.getElementById('t1-name').innerText = state.t1?.name || '--';
            document.getElementById('t1-players').innerText = (state.t1?.players || []).filter(p=>p).join(' • ') || '--';
            document.getElementById('t1-score').innerText = state.t1?.score ?? 0;
            document.getElementById('t2-name').innerText = state.t2?.name || '--';
            document.getElementById('t2-players').innerText = (state.t2?.players || []).filter(p=>p).join(' • ') || '--';
            document.getElementById('t2-score').innerText = state.t2?.score ?? 0;

            // Casters
            (state.casters || []).forEach((c, i) => {
                const box = document.getElementById(`cb-${i+1}`);
                const name = document.getElementById(`c-${i+1}-name`);
                if (box && name) {
                    if (c.active && c.name) {
                        name.innerText = c.name;
                        box.classList.add('active');
                    } else {
                        box.classList.remove('active');
                    }
                }
            });

            // Maps
            document.getElementById('maps-container').innerHTML = (state.maps || []).map(m => `
                <div class="map-wrapper ${m.status === 'active' ? 'active' : ''}">
                    ${m.status === 'active' ? '<div class="label">Prossimo Game</div>' : ''}
                    <div class="map-card">
                        <img src="${getMapUrl(m.name)}" onerror="this.src='/maps/default.png'">
                        <div class="map-name">${m.name || 'Mappa'}</div>
                    </div>
                    <div class="civ-icons left">
                        ${m.winner == 1 ? '<div class="crown">👑</div>' : ''}
                        ${(m.t1civs || []).map(c=>`<div class="civ-unit"><div class="civ-dot" style="background-image:url('${getCivUrl(c)}')"></div></div>`).join('')}
                    </div>
                    <div class="civ-icons right">
                        ${m.winner == 2 ? '<div class="crown">👑</div>' : ''}
                        ${(m.t2civs || []).map(c=>`<div class="civ-unit"><div class="civ-dot" style="background-image:url('${getCivUrl(c)}')"></div></div>`).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('central-divider').style.display = (state.maps?.length >= 2) ? 'block' : 'none';
            updateTimer();
        }

        async function init() {
            const { data } = await client.from('stream_overlays').select('state').eq('id', 'aoe4-match').single();
            if (data?.state) render(data.state);

            client.channel('public:stream_overlays')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: 'id=eq.aoe4-match' }, payload => render(payload.new.state))
                .subscribe();

            setInterval(async () => {
                const { data } = await client.from('stream_overlays').select('state').eq('id', 'aoe4-match').single();
                if (data?.state) render(data.state);
            }, 5000);

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);
        }

        init();
    </script>
</body>
</html>
