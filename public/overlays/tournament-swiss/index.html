<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>Swiss Tournament Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@700;900&family=Eagle+Lake&family=Fondamento:ital@0;1&family=MedievalSharp&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --gold-main: #d4af37;
            --gold-bright: #ffd700;
            --gold-glow: rgba(212, 175, 55, 0.45);
            --silver-main: #cbd5e1;
            --silver-bright: #f8fafc;
            --silver-glow: rgba(203, 213, 225, 0.35);
            --cyan-main: #00d2ff;
            --cyan-bright: #38bdf8;
            --cyan-glow: rgba(0, 210, 255, 0.4);
            --bg-dark: #050811;
            --card-bg: rgba(10, 15, 26, 0.88);
            --card-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #000 url('../background/background.png') no-repeat center center / cover;
            color: #ffffff;
            position: relative;
        }

        /* Ambient Glow */
        .ambient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 12%, rgba(212, 175, 55, 0.12) 0%, transparent 60%),
                        radial-gradient(circle at 85% 85%, rgba(148, 163, 184, 0.07) 0%, transparent 60%);
            pointer-events: none;
            z-index: 1;
        }

        /* Header Bar (Floating, Seamless - No Big Box) */
        #header-bar {
            position: absolute;
            top: 20px;
            left: 50px;
            right: 50px;
            height: 100px;
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-logo-badge {
            width: 52px;
            height: 52px;
            background: rgba(8, 13, 24, 0.8);
            backdrop-filter: blur(12px);
            border: 1.5px solid var(--gold-main);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px var(--gold-glow);
        }

        .header-center {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            pointer-events: auto;
        }

        .header-main-title {
            font-family: 'Eagle Lake', 'MedievalSharp', 'Almendra', cursive, serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(180deg, #ffffff 15%, #ffd700 80%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 12px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 25px rgba(212, 175, 55, 0.45));
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            max-width: 950px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.15;
        }

        .header-subtitle {
            font-family: 'MedievalSharp', 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            color: #cbd5e1;
            letter-spacing: 4px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .header-subtitle .dot {
            width: 5px;
            height: 5px;
            background: var(--cyan-main);
            box-shadow: 0 0 8px var(--cyan-glow);
            border-radius: 50%;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .view-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(8, 13, 24, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.45);
            padding: 9px 20px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cyan-bright);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 20px var(--cyan-glow);
        }

        .day-badge {
            background: rgba(8, 13, 24, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 9px 20px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }

        .day-badge span {
            color: var(--gold-bright);
        }

        /* Content Canvas */
        #content-wrapper {
            position: absolute;
            top: 136px;
            left: 50px;
            right: 50px;
            bottom: 30px;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        /* ---------------------------------------------
           VIEW A: STANDINGS (CLASSIFICA SVIZZERA)
        --------------------------------------------- */
        #view-standings {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 16px;
        }

        /* Legend Bar */
        .standings-legend {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 15, 26, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 10px 24px;
        }

        .legend-items {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .legend-badge {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .badge-gold {
            background: linear-gradient(135deg, #b8860b 0%, #ffd700 100%);
            color: #000;
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .badge-silver {
            background: linear-gradient(135deg, #64748b 0%, #cbd5e1 100%);
            color: #000;
            box-shadow: 0 0 12px var(--silver-glow);
        }

        .badge-normal {
            background: rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .legend-info {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Standings Grid */
        .standings-container {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            overflow: hidden;
        }

        .standings-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Standings Card */
        .standing-card {
            display: flex;
            align-items: center;
            height: 78px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0 18px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        /* Gold Cutoff (#1-#2) - Luxury Gold */
        .standing-card.is-gold {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.18) 0%, rgba(13, 18, 30, 0.95) 60%);
            border: 1.5px solid rgba(212, 175, 55, 0.65);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.2);
        }

        .standing-card.is-gold .card-rank-badge {
            background: linear-gradient(135deg, #d4af37, #ffd700);
            color: #000;
            box-shadow: 0 0 15px var(--gold-glow);
            font-weight: 950;
        }

        /* Silver Cutoff (#3-#4) - Metallic Silver */
        .standing-card.is-silver {
            background: linear-gradient(90deg, rgba(203, 213, 225, 0.16) 0%, rgba(13, 18, 30, 0.95) 60%);
            border: 1.5px solid rgba(203, 213, 225, 0.55);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(203, 213, 225, 0.18);
        }

        .standing-card.is-silver .card-rank-badge {
            background: linear-gradient(135deg, #94a3b8, #e2e8f0);
            color: #000;
            box-shadow: 0 0 15px var(--silver-glow);
            font-weight: 950;
        }

        /* Rank Badge */
        .card-rank-badge {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            flex-shrink: 0;
            z-index: 2;
        }

        /* Player Details */
        .card-player-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 16px;
            flex: 1;
            min-width: 0;
            z-index: 2;
        }

        .card-player-name {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .card-player-sub {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
        }

        .card-qual-tag {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .tag-gold {
            background: rgba(212, 175, 55, 0.25);
            color: var(--gold-bright);
            border: 1px solid rgba(212, 175, 55, 0.5);
        }

        .tag-silver {
            background: rgba(203, 213, 225, 0.2);
            color: #f1f5f9;
            border: 1px solid rgba(203, 213, 225, 0.45);
        }

        .tag-running {
            background: rgba(255, 255, 255, 0.06);
            color: #64748b;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Stats */
        .card-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-left: auto;
            flex-shrink: 0;
            z-index: 2;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 66px;
            height: 52px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 0 8px;
        }

        .stat-box.highlight-pts {
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.15), rgba(0, 0, 0, 0.5));
            border-color: rgba(212, 175, 55, 0.4);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }

        .stat-box.highlight-pts .stat-value {
            color: var(--gold-bright);
        }

        .stat-label {
            font-size: 9px;
            font-weight: 800;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
            line-height: 1;
        }

        /* ---------------------------------------------
           VIEW B: ROUNDS / MATCHUPS (TABELLONE TURNI)
        --------------------------------------------- */
        #view-rounds {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            gap: 16px;
        }

        .rounds-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            height: 100%;
            overflow: hidden;
        }

        .round-column {
            background: transparent;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            padding: 0;
            min-width: 0;
        }

        .round-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 13, 24, 0.85);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 9px 16px;
            margin-bottom: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        .round-title {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .round-title span {
            color: var(--cyan-bright);
            text-shadow: 0 0 12px var(--cyan-glow);
        }

        .round-badge {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(0, 210, 255, 0.15);
            color: var(--cyan-bright);
            border: 1px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
        }

        .round-matches-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
        }

        /* Match Card in Bo1 */
        .match-card {
            background: rgba(8, 13, 24, 0.88);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 5px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .match-participant {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 48px;
            padding: 0 14px;
            border-radius: 9px;
            background: rgba(10, 14, 22, 0.95);
            position: relative;
            overflow: hidden;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .match-participant-flag {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.9;
            z-index: 1;
            -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,1) 35%, rgba(0,0,0,0) 85%);
            mask-image: linear-gradient(to right, rgba(0,0,0,1) 35%, rgba(0,0,0,0) 85%);
        }

        .match-participant.is-winner {
            background: linear-gradient(90deg, rgba(34, 197, 94, 0.24) 0%, rgba(13, 18, 30, 0.92) 100%);
            border: 1.5px solid rgba(34, 197, 94, 0.55);
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.2);
        }

        .match-participant.is-winner .match-participant-flag {
            opacity: 1;
        }

        .match-participant.is-loser {
            opacity: 0.5;
        }

        .match-participant.is-loser .match-participant-flag {
            opacity: 0.4;
        }

        .participant-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
            z-index: 2;
            position: relative;
        }

        .participant-name {
            font-size: 15px;
            font-weight: 900;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .match-participant.is-winner .participant-name {
            color: #4ade80;
            text-shadow: 0 0 12px rgba(74, 222, 128, 0.5);
        }

        .participant-score {
            font-size: 16px;
            font-weight: 950;
            color: #ffffff;
            min-width: 24px;
            text-align: center;
            flex-shrink: 0;
            z-index: 2;
            position: relative;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .match-participant.is-winner .participant-score {
            color: #4ade80;
        }

        .empty-matches-msg {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 72px;
            color: #64748b;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            padding: 16px;
            background: rgba(8, 13, 24, 0.5);
            backdrop-filter: blur(8px);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 12px;
        }
    </style>
</head>

            'malians': { name: 'Maliesi', flag: 'Malians.webp' },
            'mongols': { name: 'Mongoli', flag: 'Mongols.webp' },
            'orderofthedragon': { name: 'Ordine del Dragone', flag: 'Order of the Dragon.webp' },
            'ottomans': { name: 'Ottomani', flag: 'Ottomans.webp' },
            'rus': { name: 'Rus', flag: 'Rus.webp' },
            'templar': { name: 'Cavalieri Templari', flag: 'Knights Templar.webp' },
            'zhuxi': { name: 'Eredità di Zhu Xi', flag: 'Zhu Xis Legacy.webp' },
            'tughlaq': { name: 'Dinastia Tughlaq', flag: 'Tughlaq Dynasty.webp' },
            'sengoku': { name: 'Sengoku Daimyo', flag: 'Sengoku Daimyo.webp' },
            'macedonian': { name: 'Dinastia Macedone', flag: 'Macedonian Dynasty.webp' },
            'jin-dynasty': { name: 'Dinastia Jin', flag: 'Jin Dynasty.webp' }
        };

        const { createClient } = window.supabase;
        const client = createClient(SUB_URL, SUB_KEY);
        let currentState = null;

        // Check URL parameter for forced view: ?view=standings or ?view=rounds
        const urlParams = new URLSearchParams(window.location.search);
        const forcedView = urlParams.get('view');

        function applyView(viewName) {
            const v = (viewName || '').toLowerCase();
            const viewStandings = document.getElementById('view-standings');
            const viewRounds = document.getElementById('view-rounds');
            const viewText = document.getElementById('view-text');
            if (!viewStandings || !viewRounds) return;

            if (v === 'rounds') {
                viewStandings.style.setProperty('display', 'none', 'important');
                viewRounds.style.setProperty('display', 'flex', 'important');
                if (viewText) viewText.innerText = 'TABELLONE TURNI';
            } else {
                viewStandings.style.setProperty('display', 'flex', 'important');
                viewRounds.style.setProperty('display', 'none', 'important');
                if (viewText) viewText.innerText = 'CLASSIFICA LIVE';
            }
        }

        // Apply immediately on parse
        if (forcedView) {
            applyView(forcedView);
        }

        function getCivFlagUrl(id) {
            if (!id || typeof id !== 'string') return '';
            if (id.startsWith('/civs/') || id.endsWith('.webp') || id.endsWith('.png')) {
                return id.startsWith('/') ? id : `/${id}`;
            }
            const data = CIV_DATA[id.toLowerCase()];
            if (data) {
                return data.flag.startsWith('/') ? data.flag : `/civs/${data.flag}`;
            }
            return `/civs/${id}.webp`;
        }

        function render(state, backgroundUrl, displayName) {
            if (backgroundUrl) {
                document.body.style.backgroundImage = `url(${backgroundUrl})`;
            } else {
                document.body.style.backgroundImage = "url('../background/background.png')";
            }
            if (!state && !displayName) return;
            currentState = state || {};

            // 1. Header Information (Sync title from display_name or tournamentTitle or titleText)
            const title = displayName || state?.tournamentTitle || state?.titleText || 'TORNEO AOE4 SVIZZERA';
            document.getElementById('main-title').innerText = title;
            document.getElementById('day-num').innerText = state?.dayNumber || 1;

            // 2. Determine Active View (Prioritize URL param ?view=...)
            const activeView = forcedView ? forcedView.toLowerCase() : (state?.activeView || 'standings');
            applyView(activeView);

            // 3. Render Standings (View A)
            if (state) renderStandings(state);

            // 4. Render Rounds (View B)
            if (state) renderRounds(state);
        }

        function renderStandings(state) {
            const leftCol = document.getElementById('col-left');
            const rightCol = document.getElementById('col-right');
            leftCol.innerHTML = '';
            rightCol.innerHTML = '';

            const standings = state.standings || [];

            standings.forEach((player, index) => {
                const rank = index + 1;
                const isGold = rank <= 2;
                const isSilver = rank > 2 && rank <= 4;

                const card = document.createElement('div');
                card.className = `standing-card ${isGold ? 'is-gold' : ''} ${isSilver ? 'is-silver' : ''}`;

                let badgeTagHtml = '';
                if (isGold) {
                    badgeTagHtml = `<span class="card-qual-tag tag-gold">👑 LEGA ORO</span>`;
                } else if (isSilver) {
                    badgeTagHtml = `<span class="card-qual-tag tag-silver">🛡️ LEGA D'ARGENTO</span>`;
                } else {
                    badgeTagHtml = `<span class="card-qual-tag tag-running">IN GARA</span>`;
                }

                card.innerHTML = `
                    <div class="card-rank-badge">#${rank}</div>
                    <div class="card-player-info">
                        <div class="card-player-name">${escapeHtml(player.name || 'Player')}</div>
                        <div class="card-player-sub">
                            ${badgeTagHtml}
                        </div>
                    </div>
                    <div class="card-stats">
                        <div class="stat-box">
                            <div class="stat-value">${player.wins ?? 0} - ${player.losses ?? 0}</div>
                            <div class="stat-label">V - P</div>
                        </div>
                        <div class="stat-box highlight-pts">
                            <div class="stat-value">${player.points ?? 0}</div>
                            <div class="stat-label">PUNTI</div>
                        </div>
                        ${player.tieBreak !== undefined ? `
                        <div class="stat-box">
                            <div class="stat-value">${player.tieBreak}</div>
                            <div class="stat-label">TB / DIFF</div>
                        </div>` : ''}
                    </div>
                `;

                if (index < 6 || (standings.length > 12 && index < Math.ceil(standings.length / 2))) {
                    leftCol.appendChild(card);
                } else {
                    rightCol.appendChild(card);
                }
            });

            if (standings.length === 0) {
                leftCol.innerHTML = `<div class="empty-matches-msg">Nessun giocatore in classifica</div>`;
            }
        }

        function renderRounds(state) {
            const roundsData = state.rounds || {};

            for (let r = 1; r <= 4; r++) {
                const roundContainer = document.getElementById(`matches-round-${r}`);
                if (!roundContainer) continue;
                roundContainer.innerHTML = '';

                const matches = roundsData[r] || [];

                if (matches.length === 0) {
                    roundContainer.innerHTML = `<div class="empty-matches-msg">Turno in attesa</div>`;
                    continue;
                }

                matches.forEach(m => {
                    const matchCard = document.createElement('div');
                    matchCard.className = 'match-card';

                    const p1Name = m.p1?.name || '--';
                    const p2Name = m.p2?.name || '--';
                    const p1Score = m.p1?.score ?? (m.winner === 1 ? 1 : 0);
                    const p2Score = m.p2?.score ?? (m.winner === 2 ? 1 : 0);

                    const p1Winner = m.winner === 1;
                    const p2Winner = m.winner === 2;
                    const isDone = p1Winner || p2Winner;

                    const p1Flag = getCivFlagUrl(m.p1?.civId);
                    const p2Flag = getCivFlagUrl(m.p2?.civId);

                    matchCard.innerHTML = `
                        <div class="match-participant ${p1Winner ? 'is-winner' : ''} ${isDone && !p1Winner ? 'is-loser' : ''}">
                            ${p1Flag ? `<div class="match-participant-flag" style="background-image: url('${p1Flag}')"></div>` : ''}
                            <div class="participant-left">
                                <span class="participant-name">${escapeHtml(p1Name)}</span>
                            </div>
                            <span class="participant-score">${isDone ? (p1Winner ? '🏆' : p1Score) : '-'}</span>
                        </div>
                        <div class="match-participant ${p2Winner ? 'is-winner' : ''} ${isDone && !p2Winner ? 'is-loser' : ''}">
                            ${p2Flag ? `<div class="match-participant-flag" style="background-image: url('${p2Flag}')"></div>` : ''}
                            <div class="participant-left">
                                <span class="participant-name">${escapeHtml(p2Name)}</span>
                            </div>
                            <span class="participant-score">${isDone ? (p2Winner ? '🏆' : p2Score) : '-'}</span>
                        </div>
                    `;

                    roundContainer.appendChild(matchCard);
                });
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        async function init() {
            try {
                const { data } = await client.from('stream_overlays').select('state, background_url, display_name').eq('id', OVERLAY_ID).single();
                if (data) render(data.state, data.background_url, data.display_name);
            } catch (err) {
                console.error('Init error:', err);
            }

            client.channel(`public:${OVERLAY_ID}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'stream_overlays', filter: `id=eq.${OVERLAY_ID}` }, payload => {
                    render(payload.new.state, payload.new.background_url, payload.new.display_name);
                })
                .subscribe();

            setInterval(async () => {
                try {
                    const { data } = await client.from('stream_overlays').select('state, background_url, display_name').eq('id', OVERLAY_ID).single();
                    if (data) render(data.state, data.background_url, data.display_name);
                } catch (e) {}
            }, 5000);
        }

        init();
    </script>
</body>
</html>
