name: Daily Supabase Backup

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *' # Esegue tutti i giorni alle 03:00 UTC
  workflow_dispatch: # Permette l'avvio manuale dal sito GitHub se necessario

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per fare push sulla repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Versione stabile LTS

      - name: Install Dependencies
        run: npm ci

      - name: Run Backup Script
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backup

      - name: Commit and Push
        run: |
          # Fix per l'errore 128 (Dubious ownership)
          git config --global --add safe.directory /github/workspace
          git config --global user.name "GitHub Action Backup Bot"
          git config --global user.email "action@github.com"
          
          git add backups/ --force
          
          # Evita errore se non ci sono modifiche
          if git diff --staged --quiet; then
            echo "Nessun nuovo dato nel backup di oggi. Commit skippato."
          else
            git commit -m "📦 Salvataggio automatico database e storage Supabase [skip ci]"
            git push origin main
          fi
